<title>BBQS Progress</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  /* Layout: one reading column; each phase is a section, its milestones a checklist with dates. */
  :root {
    --bg: #f6f7f9; --surface: #ffffff; --line: #dde2e8; --fg: #17212c; --muted: #5b6676;
    --accent: #1d5fa8; --ok: #1d7a4e; --ok-soft: #e2f3ea; --run: #1d5fa8; --run-soft: #e3edf8;
    --todo: #6b7280; --todo-soft: #eceef1; --track: #e7ebf0;
    --f-display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
    --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #11161d; --surface: #182029; --line: #2a3542; --fg: #e4e9f0; --muted: #98a4b4;
    --accent: #6aa6ea; --ok: #5cc28e; --ok-soft: #15301f; --run: #6aa6ea; --run-soft: #1b2c42;
    --todo: #9aa3af; --todo-soft: #222a33; --track: #26303c; color-scheme: dark;
  } }
  :root[data-theme="dark"] {
    --bg: #11161d; --surface: #182029; --line: #2a3542; --fg: #e4e9f0; --muted: #98a4b4;
    --accent: #6aa6ea; --ok: #5cc28e; --ok-soft: #15301f; --run: #6aa6ea; --run-soft: #1b2c42;
    --todo: #9aa3af; --todo-soft: #222a33; --track: #26303c; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { background: var(--bg); color: var(--fg); }
  body { margin: 0; font: 15px/1.55 var(--f-body); }
  .wrap { max-width: 860px; margin: 0 auto; padding-inline: 16px; padding-block: 32px 64px; display: grid; gap: 28px; }
  h1, h2 { font-family: var(--f-display); font-weight: 600; text-wrap: balance; margin: 0; }
  h1 { font-size: 30px; }
  h2 { font-size: 21px; }
  p { margin: 0; max-width: 68ch; }
  .muted { color: var(--muted); }
  header { display: grid; gap: 6px; }
  .lede { font-size: 16px; }
  .phase { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 20px; display: grid; gap: 14px; }
  .phase-head { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: baseline; }
  .pill { font-size: 12px; font-weight: 600; padding: 2px 10px; border-radius: 999px; white-space: nowrap; }
  .pill.Done { background: var(--ok-soft); color: var(--ok); }
  .pill.In-progress { background: var(--run-soft); color: var(--run); }
  .pill.Todo { background: var(--todo-soft); color: var(--todo); }
  .date { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .bar { height: 8px; background: var(--track); border-radius: 4px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); }
  .bar.small { height: 5px; }
  .barrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  ol.ms { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
  ol.ms > li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 4px 10px; padding: 12px 0; border-top: 1px solid var(--line); }
  .mark { width: 16px; height: 16px; border-radius: 50%; margin-top: 4px; border: 2px solid var(--todo); }
  .mark.Done { background: var(--ok); border-color: var(--ok); }
  .mark.In-progress { border-color: var(--run); background: linear-gradient(90deg, var(--run) 50%, transparent 50%); }
  .ms-title { font-weight: 600; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; }
  .ms-body { grid-column: 2; display: grid; gap: 6px; font-size: 14px; }
  .label { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .measures { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
  .measure { border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; display: grid; gap: 2px; }
  .measure b { font: 600 22px/1.15 var(--f-display); font-variant-numeric: tabular-nums; }
  .measure span { font-size: 12.5px; color: var(--muted); }
  footer { font-size: 13px; color: var(--muted); display: grid; gap: 4px; }
  a { color: var(--accent); }
</style>

<div class="wrap">
  <header>
    <h1>BBQS Progress</h1>
    <p class="lede" id="lede"></p>
    <p class="date" id="stamp"></p>
  </header>
  <main id="phases" style="display:grid;gap:20px"></main>
  <footer id="foot"></footer>
</div>

<script>
const P = /*__PROGRESS__*/null;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const day = s => s ? new Date(s + "T00:00:00Z").toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric", timeZone: "UTC" }) : "";
const cls = s => (s || "Todo").replace(" ", "-");
const bar = (pct, small) => `<div class="bar${small ? " small" : ""}"><i style="width:${Math.max(0, Math.min(100, pct || 0))}%"></i></div>`;

if (!P) {
  $("#phases").innerHTML = `<p class="muted">No progress data was embedded. Run scripts/progress/build-progress.mjs with --html.</p>`;
} else {
  const built = new Date(P.generated_at);
  $("#stamp").textContent = `Updated ${built.toLocaleDateString("en-US", { dateStyle: "long", timeZone: "UTC" })}, from the BBQS project board.`;
  const active = P.phases.find(p => p.status === "In progress" && p.milestones.length);
  $("#lede").textContent = active
    ? `${P.phases.length} phases on the roadmap. Current focus: ${active.title}, with ${active.milestones.filter(m => m.status === "Done").length} of ${active.milestones.length} milestones done.`
    : `${P.phases.length} phases on the roadmap.`;

  $("#phases").innerHTML = P.phases.map(p => {
    const ms = p.milestones;
    const done = ms.filter(m => m.status === "Done").length;
    const pct = ms.length ? Math.round(100 * done / ms.length) : null;
    const measures = p.measures?.length ? `<div style="display:grid;gap:8px"><span class="label">Measured each day</span><div class="measures">${p.measures.map(x =>
      `<div class="measure"><b>${esc(x.value)}</b><span>${esc(x.label)}</span><span>Goal: ${esc(x.goal)}</span></div>`).join("")}</div></div>` : "";
    const list = ms.length ? `<ol class="ms">${ms.map(m => {
      const now = m.status === "Done" ? "" : m.measures
        ? `<p><span class="label">Now</span> ${m.measures.map(x => `${esc(x.label.toLowerCase())} <b>${esc(x.value)}</b> (goal ${esc(x.goal)})`).join("; ")}</p>`
        : m.now ? `<p><span class="label">Now</span> ${esc(m.now)}</p>` : "";
      const work = m.progress.total ? `<div class="barrow">${bar(m.progress.percent, true)}<span>${m.progress.completed} of ${m.progress.total} work items done</span></div>` : "";
      return `<li><i class="mark ${cls(m.status)}" title="${esc(m.status)}"></i>
        <div class="ms-title">${esc(m.title)}<span class="date">${m.status === "Done" ? "done" : m.target ? "target " + day(m.target) : ""}</span></div>
        <div class="ms-body">${m.done_when ? `<p><span class="label">Done when</span> ${esc(m.done_when)}</p>` : ""}${now}${work}</div></li>`;
    }).join("")}</ol>` : `<p class="muted">${esc(p.done_when || "Milestones to be defined.")}</p>`;
    return `<section class="phase">
      <div class="phase-head"><h2>${esc(p.title)}</h2><span class="pill ${cls(p.status)}">${esc(p.status)}</span>${p.target ? `<span class="date">target ${day(p.target)}</span>` : ""}</div>
      ${p.what ? `<p>${esc(p.what)}</p>` : ""}
      ${pct != null ? `<div class="barrow">${bar(pct)}<span>${done} of ${ms.length} milestones</span></div>` : ""}
      ${measures}${list}
    </section>`;
  }).join("");

  const n = P.not_on_roadmap.length;
  $("#foot").innerHTML = `<p>Each phase is broken into milestones with a clear finish line; each milestone's work is tracked as issues on the BBQS project board, and this page is rebuilt from it every day.</p>`
    + (n ? `<p>${n} open issue${n === 1 ? " is" : "s are"} not yet placed on the roadmap.</p>` : "");
}
</script>

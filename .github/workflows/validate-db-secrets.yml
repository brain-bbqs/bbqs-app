name: Validate DB secrets

# Manual, read-only diagnostic for the sandbox/prod database credentials.
# Prints a REDACTED shape of each secret and attempts a trivial connection so
# a misconfigured secret can be identified without running the whole pipeline.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Report which credentials are configured
        run: |
          set -u
          report() { if [ -n "$2" ]; then echo "$1: set (length ${#2})"; else echo "$1: MISSING"; fi; }
          report SANDBOX_SUPABASE_DB_URL "${SANDBOX_DB_URL:-}"
          report SANDBOX_DB_PASSWORD "${SANDBOX_DB_PASSWORD:-}"
          report SANDBOX_SUPABASE_ANON_KEY "${SANDBOX_ANON_KEY:-}"
          report SANDBOX_GITHUB_PAT "${SANDBOX_PAT:-}"
          report STAGING_SEED_TOKEN "${SEED_TOKEN:-}"
          echo "SANDBOX_DB_REGION variable: '${{ vars.SANDBOX_DB_REGION }}' (default us-east-1)"
        env:
          SANDBOX_DB_URL: ${{ secrets.SANDBOX_SUPABASE_DB_URL }}
          SANDBOX_DB_PASSWORD: ${{ secrets.SANDBOX_DB_PASSWORD }}
          SANDBOX_ANON_KEY: ${{ secrets.SANDBOX_SUPABASE_ANON_KEY }}
          SANDBOX_PAT: ${{ secrets.SANDBOX_GITHUB_PAT }}
          SEED_TOKEN: ${{ secrets.STAGING_SEED_TOKEN }}

      - name: Normalize sandbox DB URL
        run: source .github/scripts/pg-url-normalize.sh DB_URL DB_URL_SAFE
        env:
          DB_URL: ${{ secrets.SANDBOX_SUPABASE_DB_URL }}
          FALLBACK_REF: vzfsndsqveacpefoqwsu
          FALLBACK_PASSWORD: ${{ secrets.SANDBOX_DB_PASSWORD }}
          FALLBACK_REGION: ${{ vars.SANDBOX_DB_REGION || 'us-east-1' }}

      - name: Test sandbox connection
        run: |
          set -euo pipefail
          psql "$DB_URL_SAFE" -c "select current_database(), current_user, version();"

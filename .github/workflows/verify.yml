name: Verify (typecheck + build + tests)

# The green gate a Class-A PR must clear before class-a-automerge.yml will merge it to dev. Guards
# (guards.yml) run the fast invariant suite separately; this adds the checks that prove the change
# actually compiles and builds. Make BOTH this workflow's `verify` job and `guards` required status
# checks on `dev` in branch protection — that is what makes "one-click approve" safe.

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No package-lock.json (bun.lock is the committed lockfile), so `npm ci` cannot run.
      - run: npm install

      - name: Triage classifier tests
        run: npm run test:triage

      - name: Guard suite
        run: npm run test:guards

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production

name: Sandbox QA (clone prod -> build -> sandbox repo)

# ONE workflow, MANUAL ONLY for now. Rebuilt from scratch on 2026-08-11 after the
# old qa.yml / sync-sandbox-schema.yml pair was deleted.
#
# Order of operations (each stage gates the next):
#   1. verify-prod  – is PRODUCTION's schema still exactly what this repo says it is?
#                     Any pending/extra migration is DRIFT and stops the run.
#   2. approve      – GitHub Environment gate. Required when drift was found (or when
#                     the operator asks for it). A human approves before we touch data.
#   3. sandbox      – push migrations to the SANDBOX project, then clone prod data into
#                     it so the sandbox is an exact replica.
#   4. build        – npm build of the frontend pointed at the SANDBOX database.
#                     The build is then force-pushed to a SEPARATE sandbox repository
#                     (brain-bbqs/bbqs-website-sandbox), which serves it from its own GitHub
#                     Pages site and URL. Production Pages is never touched.
#
# Auto-triggers (push/PR) are intentionally absent; add `push: branches: [dev]` once
# the manual loop is green.

on:
  workflow_dispatch:
    inputs:
      allow_drift:
        description: 'Continue even if production schema drifts from the repo'
        type: boolean
        default: false
      clone_data:
        description: 'Clone production data into the sandbox (exact replica)'
        type: boolean
        default: true
      deploy_pages:
        description: 'Publish the build to the sandbox repository (its own Pages site)'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: sandbox-qa
  cancel-in-progress: false

jobs:
  # 1 ── Production must match the repo before anything downstream runs.
  verify-prod:
    name: 1. Verify production schema
    runs-on: ubuntu-latest
    outputs:
      drift: ${{ steps.drift.outputs.drift }}
    steps:
      - uses: actions/checkout@v4

      - name: Check prod secret is present
        run: '[ -n "$DB_URL" ] || { echo "::error::Missing secret SUPABASE_KG_DB_URL"; exit 1; }'
        env:
          DB_URL: ${{ secrets.SUPABASE_KG_DB_URL }}

      - name: Normalize prod DB URL
        run: source .github/scripts/pg-url-normalize.sh DB_URL PROD_URL_SAFE
        env:
          DB_URL: ${{ secrets.SUPABASE_KG_DB_URL }}
          # Self-heal: if SUPABASE_KG_DB_URL is the IPv6-only direct host (unreachable
          # from GitHub runners), rebuild a Session pooler URI from ref + password.
          FALLBACK_REF: ${{ vars.PROD_PROJECT_REF || 'vpexxhfpvghlejljwpvt' }}
          FALLBACK_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
          FALLBACK_REGION: ${{ vars.PROD_DB_REGION || 'us-east-1' }}
          FALLBACK_HOST: ${{ vars.PROD_DB_HOST }}

      - name: Resolve IPv4 (best effort)
        continue-on-error: true
        run: source .github/scripts/pg-ipv4-env.sh PROD_URL_SAFE

      - uses: supabase/setup-cli@v1
        with:
          version: 2.114.0

      - name: Compare repo migrations against production
        id: drift
        run: |
          set -euo pipefail
          supabase migration list --db-url "$PROD_URL_SAFE" | tee /tmp/mig.txt
          # A row with a Local version but no Remote version = not applied to prod.
          # A row with a Remote version but no Local version = applied by hand, not in repo.
          pending=$(awk -F'|' 'NR>2 && NF>=3 {
              gsub(/ /,"",$1); gsub(/ /,"",$2);
              if ($1 != "" && $2 == "") print $1;
              if ($1 == "" && $2 != "") print $2;
            }' /tmp/mig.txt)
          if [ -n "$pending" ]; then
            echo "drift=true" >> "$GITHUB_OUTPUT"
            {
              echo "### :warning: Production schema drift"
              echo ''
              echo 'These migration versions differ between the repo and production:'
              echo '```'
              echo "$pending"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "drift=false" >> "$GITHUB_OUTPUT"
            echo "### :white_check_mark: Production schema matches the repo" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Stop on drift
        if: ${{ steps.drift.outputs.drift == 'true' && inputs.allow_drift == false }}
        run: |
          echo "::error::Production schema drifts from the repo. Reconcile it (Apply prod schema workflow) or re-run with allow_drift = true, which requires approval."
          exit 1

  # 2 ── Human approval. Protect the `sandbox-approval` environment with required
  #      reviewers in Settings → Environments; that is what makes this a real gate.
  approve:
    name: 2. Approval
    needs: verify-prod
    runs-on: ubuntu-latest
    environment: sandbox-approval
    steps:
      - run: echo "Approved. Prod drift = ${{ needs.verify-prod.outputs.drift }}"

  # 3 ── Sandbox becomes an exact replica of production.
  sandbox:
    name: 3. Migrate + clone sandbox
    needs: [verify-prod, approve]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check sandbox credentials
        run: |
          if [ -z "${SANDBOX_DB_URL}" ] && [ -z "${SANDBOX_DB_PASSWORD}" ]; then
            echo "::error::Set secret SANDBOX_DB_PASSWORD (preferred) or SANDBOX_SUPABASE_DB_URL (postgresql:// Session pooler URI)."
            exit 1
          fi
          if [ -z "${SANDBOX_DB_URL}" ] && [ -z "${SANDBOX_DB_HOST}" ]; then
            echo "::error::SANDBOX_DB_HOST was not received. Set it to the hostname only (for example aws-0-ca-central-1.pooler.supabase.com) as a repository Actions Variable or Secret. Environment-only values are not visible to this job."
            exit 1
          fi
          if [ -z "${SANDBOX_DB_URL}" ]; then
            echo "Sandbox connection will be assembled with host: ${SANDBOX_DB_HOST}"
          else
            echo "Sandbox connection will use SANDBOX_SUPABASE_DB_URL."
          fi
        env:
          SANDBOX_DB_URL: ${{ secrets.SANDBOX_SUPABASE_DB_URL }}
          SANDBOX_DB_PASSWORD: ${{ secrets.SANDBOX_DB_PASSWORD }}
          SANDBOX_DB_HOST: ${{ secrets.SANDBOX_DB_HOST || vars.SANDBOX_DB_HOST }}

      - name: Normalize sandbox DB URL
        run: source .github/scripts/pg-url-normalize.sh SANDBOX_DB_URL SANDBOX_URL_SAFE
        env:
          SANDBOX_DB_URL: ${{ secrets.SANDBOX_SUPABASE_DB_URL }}
          FALLBACK_REF: ${{ vars.SANDBOX_PROJECT_REF || 'vzfsndsqveacpefoqwsu' }}
          FALLBACK_PASSWORD: ${{ secrets.SANDBOX_DB_PASSWORD }}
          FALLBACK_REGION: ${{ vars.SANDBOX_DB_REGION || 'ca-central-1' }}
          FALLBACK_HOST: ${{ secrets.SANDBOX_DB_HOST || vars.SANDBOX_DB_HOST }}

      - name: Normalize prod DB URL
        run: source .github/scripts/pg-url-normalize.sh DB_URL PROD_URL_SAFE
        env:
          DB_URL: ${{ secrets.SUPABASE_KG_DB_URL }}
          # Self-heal: if SUPABASE_KG_DB_URL is the IPv6-only direct host (unreachable
          # from GitHub runners), rebuild a Session pooler URI from ref + password.
          FALLBACK_REF: ${{ vars.PROD_PROJECT_REF || 'vpexxhfpvghlejljwpvt' }}
          FALLBACK_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
          FALLBACK_REGION: ${{ vars.PROD_DB_REGION || 'us-east-1' }}
          FALLBACK_HOST: ${{ vars.PROD_DB_HOST }}

      - uses: supabase/setup-cli@v1
        with:
          version: 2.114.0

      # Supabase now runs Postgres 17; pg_dump refuses to dump a newer server, so the
      # client major version must be >= the server's.
      - name: Install postgres client 17
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
          sudo sed -i 's|deb |deb [signed-by=/usr/share/keyrings/pgdg.gpg] |' /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          # Ubuntu runners ship an older client first on PATH; pin 17 for this job.
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Show client version
        run: pg_dump --version

      # The repo's migration chain is NOT self-contained (the oldest migrations assume
      # tables created in Lovable before history was recorded), so `supabase db push`
      # into a fresh project fails with 42P01. For an exact replica we clone prod's
      # schema directly instead, then copy prod's migration history so drift checks
      # keep working.
      - name: Clone production schema into sandbox
        run: bash .github/scripts/clone-prod-schema-to-sandbox.sh
        env:
          PROD_URL: ${{ env.PROD_URL_SAFE }}
          SANDBOX_URL: ${{ env.SANDBOX_URL_SAFE }}

      - name: Clone production data into sandbox
        if: ${{ inputs.clone_data }}
        run: bash .github/scripts/clone-prod-to-sandbox.sh
        env:
          PROD_URL: ${{ env.PROD_URL_SAFE }}
          SANDBOX_URL: ${{ env.SANDBOX_URL_SAFE }}
          CLONE_AUTH: 'true'

      - name: Neutralize production-only jobs/secrets in sandbox
        if: ${{ inputs.clone_data }}
        run: psql "$SANDBOX_URL_SAFE" -v ON_ERROR_STOP=1 -f .github/sql/sandbox-localize.sql

  # 4 ── Build the frontend against the sandbox database, then publish it to the
  #      SEPARATE sandbox repository, which serves it with its own GitHub Pages URL.
  build-deploy:
    name: 4. Build + publish to sandbox repo
    needs: sandbox
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # No package-lock.json in this repo (bun.lock is the committed lockfile), so `npm ci` cannot run.
      - run: npm install

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production
          VITE_SUPABASE_URL: https://${{ vars.SANDBOX_PROJECT_REF || 'vzfsndsqveacpefoqwsu' }}.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SANDBOX_SUPABASE_ANON_KEY }}
          VITE_AUTH_COOKIE_DOMAIN: ''
          # This deployment is served from sandbox.brain-bbqs.org at the domain root.
          # Do not inherit a stale repository base-path variable: that makes index.html
          # request /bbqs-website-sandbox/assets/* and produces a blank page.
          VITE_BASE_PATH: /

      - name: SPA fallback for GitHub Pages
        env:
          SANDBOX_DOMAIN: ${{ vars.SANDBOX_DOMAIN || 'sandbox.brain-bbqs.org' }}
        run: |
          touch dist/.nojekyll
          cp dist/index.html dist/404.html
          # public/CNAME carries the PRODUCTION domain (app.brain-bbqs.org). Shipping it
          # to the sandbox repo would make the sandbox Pages site claim production's
          # domain (both repos cannot own it), so overwrite with the sandbox domain.
          printf '%s\n' "$SANDBOX_DOMAIN" > dist/CNAME

      # Fails loudly instead of shipping a blank page: if index.html asks for assets
      # under any prefix other than /assets, the base path leaked in from somewhere.
      - name: Verify asset base path is the domain root
        run: |
          set -euo pipefail
          # A leaked base path shows up as either a nested prefix (/bbqs-website-sandbox/...)
          # or a relative reference (./assets/..., assets/...). Root-level files such as
          # /favicon.png are correct and must NOT fail the guard.
          bad=$(grep -Eo '(src|href)="[^"]+"' dist/index.html \
            | sed -E 's/.*="([^"]+)"/\1/' \
            | grep -Ev '^(https?:)?//' \
            | grep -Ev '^(data:|mailto:|#)' \
            | grep -Ev '^/[^/]+$' \
            | grep -Ev '^/assets/' || true)
          if [ -n "$bad" ]; then
            echo "::error::dist/index.html references non-root paths — the build used a base path other than '/':"
            echo "$bad"
            exit 1
          fi
          echo "OK: assets are referenced from the domain root."
          grep -Eo '(src|href)="/assets/[^"]+"' dist/index.html
          # Every referenced bundle must actually exist in the output, or Pages will
          # serve a 200 index.html whose scripts all 404 (the blank-page signature).
          missing=0
          while read -r ref; do
            [ -n "$ref" ] || continue
            if [ ! -f "dist${ref}" ]; then
              echo "::error::index.html references ${ref} but dist${ref} does not exist."
              missing=1
            fi
          done < <(grep -Eo '(src|href)="/assets/[^"]+"' dist/index.html | sed -E 's/.*="([^"]+)"/\1/')
          [ "$missing" -eq 0 ] || exit 1
          echo "OK: every referenced bundle exists in dist/."
        shell: bash

      - name: Keep the build as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-dist
          path: dist
          retention-days: 7

      # Publishes to the SEPARATE sandbox repository — brain-bbqs/bbqs-website-sandbox
      # (override with vars.SANDBOX_PAGES_REPO) — on its `gh-pages` branch. That repo
      # owns its own Pages site and URL, so a sandbox deploy can never overwrite
      # production.
      # Requires secret SANDBOX_GITHUB_PAT with `repo` scope on the target repo.
      - name: Publish to the sandbox repository
        if: ${{ inputs.deploy_pages }}
        env:
          TARGET_REPO: ${{ vars.SANDBOX_PAGES_REPO || 'brain-bbqs/bbqs-website-sandbox' }}
          TARGET_BRANCH: ${{ vars.SANDBOX_PAGES_BRANCH || 'gh-pages' }}
          PAT: ${{ secrets.SANDBOX_GITHUB_PAT }}
        run: |
          set -euo pipefail
          if [ -z "$PAT" ]; then
            echo "::error::Set secret SANDBOX_GITHUB_PAT (token with write access to $TARGET_REPO)."
            exit 1
          fi
          if [ "$TARGET_REPO" = "$GITHUB_REPOSITORY" ]; then
            echo "::error::SANDBOX_PAGES_REPO points at this repository. The sandbox must live in its own repo."
            exit 1
          fi
          cd dist
          git init -q
          git checkout -q -B "$TARGET_BRANCH"
          git config user.name  "bbqs-sandbox-bot"
          git config user.email "actions@github.com"
          git add -A
          git commit -q -m "sandbox build from ${GITHUB_REPOSITORY}@${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${PAT}@github.com/${TARGET_REPO}.git" "$TARGET_BRANCH"
          echo "### Sandbox published" >> "$GITHUB_STEP_SUMMARY"

      # The gh-pages branch holds ONLY the compiled site, which is why the sandbox repo
      # looks empty when browsed. Mirror the full application source (src/, public/,
      # supabase/, config, workflows) onto the sandbox repo's default branch so it is a
      # complete clone of this repository, not just a build artifact.
      - name: Mirror application source to the sandbox repository
        if: ${{ inputs.deploy_pages }}
        env:
          TARGET_REPO: ${{ vars.SANDBOX_PAGES_REPO || 'brain-bbqs/bbqs-website-sandbox' }}
          SOURCE_BRANCH: ${{ vars.SANDBOX_SOURCE_BRANCH || 'main' }}
          PAT: ${{ secrets.SANDBOX_GITHUB_PAT }}
        run: |
          set -euo pipefail
          if [ "$TARGET_REPO" = "$GITHUB_REPOSITORY" ]; then
            echo "::error::SANDBOX_PAGES_REPO points at this repository."
            exit 1
          fi
          mirror=$(mktemp -d)
          # Copy the checked-out working tree, minus git metadata and build output.
          rsync -a --exclude='.git' --exclude='.git/**' --exclude='node_modules' \
                   --exclude='dist' --exclude='.github/workflows' ./ "$mirror/"
          # public/CNAME would make this branch claim production's domain if Pages were
          # ever pointed at it; the sandbox domain is written into the build instead.
          rm -f "$mirror/public/CNAME"
          cd "$mirror"
          git init -q
          git checkout -q -B "$SOURCE_BRANCH"
          git config user.name  "bbqs-sandbox-bot"
          git config user.email "actions@github.com"
          git add -A
          git commit -q -m "source mirror from ${GITHUB_REPOSITORY}@${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${PAT}@github.com/${TARGET_REPO}.git" "$SOURCE_BRANCH"
          echo "Mirrored source to \`${TARGET_REPO}\` (branch \`${SOURCE_BRANCH}\`)." >> "$GITHUB_STEP_SUMMARY"

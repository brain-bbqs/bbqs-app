name: Sync sandbox schema + QA + auto-merge

# Applies migrations from every pull request to the SANDBOX Supabase project
# (vzfsndsqveacpefoqwsu), builds the frontend against the sandbox backend,
# deploys it to the sandbox GitHub Pages site, runs Playwright QA, and
# auto-merges the PR when sandbox QA passes.
#
# Required repo secrets:
#   SANDBOX_SUPABASE_DB_URL       postgresql://postgres:<pw>@db.vzfsndsqveacpefoqwsu.supabase.co:5432/postgres
#   SANDBOX_SUPABASE_ANON_KEY     sandbox project anon/public key
#   CI_AUTH_SECRET                shared token for the ci-auth edge function
#   SANDBOX_GITHUB_PAT            PAT with repo scope for brain-bbqs/bbqs-website-sandbox
# Required repo variables:
#   SANDBOX_PREVIEW_URL           https://<sandbox-host> (e.g. https://brain-bbqs.github.io/bbqs-website-sandbox)
# Optional repo variable:
#   SANDBOX_MIGRATIONS_ENABLED    'true' to actually push on PRs (otherwise dry-run only)
#   SANDBOX_AUTO_MERGE_ENABLED    'true' to enable auto-merge after sandbox QA passes

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'List pending migrations only (no changes)'
        type: boolean
        default: true

concurrency:
  group: sandbox-schema
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: read
  checks: read

jobs:
  changed-files:
    runs-on: ubuntu-latest
    outputs:
      migrations: ${{ steps.filter.outputs.migrations }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            migrations:
              - 'supabase/migrations/**'

  migrate:
    runs-on: ubuntu-latest
    needs: changed-files
    outputs:
      pushed: ${{ steps.push-status.outputs.pushed || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify sandbox DB URL secret is present
        run: '[ -n "$DB_URL" ] || { echo "::error::Missing secret SANDBOX_SUPABASE_DB_URL"; exit 1; }'
        env:
          DB_URL: ${{ secrets.SANDBOX_SUPABASE_DB_URL }}

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: List pending migrations (drift report)
        id: drift
        continue-on-error: true
        run: |
          supabase migration list --db-url "$DB_URL" | tee /tmp/drift.txt
        env:
          DB_URL: ${{ secrets.SANDBOX_SUPABASE_DB_URL }}

      - name: Comment drift report on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '### Sandbox schema drift (`vzfsndsqveacpefoqwsu`)\n\n';
            try {
              body += '```\n' + fs.readFileSync('/tmp/drift.txt', 'utf8').slice(0, 60000) + '\n```';
            } catch (e) {
              body += '_Could not read drift report._';
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Push migrations to sandbox
        # PRs push only when explicitly enabled and migrations changed;
        # main always pushes; manual dispatch pushes when dry_run=false.
        if: ${{ (github.event_name == 'pull_request' && needs.changed-files.outputs.migrations == 'true' && vars.SANDBOX_MIGRATIONS_ENABLED == 'true') || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false) }}
        run: supabase db push --db-url "$DB_URL" --include-all
        env:
          DB_URL: ${{ secrets.SANDBOX_SUPABASE_DB_URL }}

      - name: Record push status
        id: push-status
        if: ${{ (github.event_name == 'pull_request' && needs.changed-files.outputs.migrations == 'true' && vars.SANDBOX_MIGRATIONS_ENABLED == 'true') || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false) }}
        run: echo "pushed=true" >> "$GITHUB_OUTPUT"

  deploy-frontend:
    name: Deploy sandbox frontend
    runs-on: ubuntu-latest
    needs: migrate
    if: always() && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped')
    outputs:
      preview_url: ${{ vars.SANDBOX_PREVIEW_URL }}
    steps:
      - name: Verify sandbox preview URL is configured
        run: |
          [ -n "$PREVIEW_URL" ] || { echo "::error::Missing variable SANDBOX_PREVIEW_URL"; exit 1; }
          [ -n "$ANON_KEY" ] || { echo "::error::Missing secret SANDBOX_SUPABASE_ANON_KEY"; exit 1; }
          [ -n "$PAT" ] || { echo "::error::Missing secret SANDBOX_GITHUB_PAT"; exit 1; }
        env:
          PREVIEW_URL: ${{ vars.SANDBOX_PREVIEW_URL }}
          ANON_KEY: ${{ secrets.SANDBOX_SUPABASE_ANON_KEY }}
          PAT: ${{ secrets.SANDBOX_GITHUB_PAT }}

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Write sandbox environment
        run: |
          sed -i "s|SANDBOX_ANON_KEY_PLACEHOLDER|$ANON_KEY|" .env.sandbox
          cat .env.sandbox
        env:
          ANON_KEY: ${{ secrets.SANDBOX_SUPABASE_ANON_KEY }}

      - name: Build sandbox frontend
        run: npm run build
        env:
          NODE_ENV: production

      - name: Deploy to sandbox GitHub Pages repo
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.SANDBOX_GITHUB_PAT }}
          repository-name: brain-bbqs/bbqs-website-sandbox
          branch: gh-pages
          folder: dist
          clean: true

  qa:
    name: Sandbox QA
    needs: deploy-frontend
    if: github.event_name == 'pull_request' && needs.deploy-frontend.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run functional tests against sandbox
        run: |
          npx playwright test --project=chromium --ignore-snapshots \
            e2e/api-health.spec.ts \
            e2e/data-integrity.spec.ts \
            e2e/console-errors.spec.ts \
            e2e/navigation.spec.ts \
            e2e/smoke.spec.ts
        env:
          BASE_URL: ${{ needs.deploy-frontend.outputs.preview_url }}
          VITE_SUPABASE_URL: https://vzfsndsqveacpefoqwsu.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SANDBOX_SUPABASE_ANON_KEY }}
          CI: true
          CI_AUTH_SECRET: ${{ secrets.CI_AUTH_SECRET }}

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-qa-report
          path: playwright-report/
          retention-days: 14

      - name: Upload screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-qa-screenshots
          path: test-results/
          retention-days: 14

  auto-merge:
    name: Auto-merge on sandbox QA pass
    needs: qa
    if: github.event_name == 'pull_request' && vars.SANDBOX_AUTO_MERGE_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}

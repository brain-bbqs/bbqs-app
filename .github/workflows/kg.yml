name: KG gate

# Build phase 7 (kg/README.md). Runs on every PR so the `kg` check can be required, but only does
# work when the change touches kg/ -- everything else passes in seconds. Fails on a regression
# against kg/quality_baseline.json, never on a known gap. The fresh-export step reads live data,
# so it reports without blocking: data can change under a PR that didn't touch the exporter.
on:
  pull_request:
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kg:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Does this change touch the KG?
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          base="$PR_BASE"; [ "$EVENT" = "push" ] && base="$PUSH_BEFORE"
          if [ "$EVENT" = "workflow_dispatch" ] || [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! files=$(git diff --name-only "$base" HEAD); then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if echo "$files" | grep -qE '^(kg/|\.github/workflows/kg\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "No kg/ changes; nothing to check."
          fi

      - uses: actions/setup-python@v5
        if: steps.scope.outputs.run == 'true'
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: kg/requirements*.txt

      - name: Install
        if: steps.scope.outputs.run == 'true'
        run: pip install -r kg/requirements-generate.txt

      - name: Gate -- fixtures, committed export vs baseline, generated OWL/SHACL drift
        if: steps.scope.outputs.run == 'true'
        run: python kg/ci_check.py --check-generated

      - name: SOSA layer -- RED/GREEN fixtures, built layer vs the committed export (kg/sosa/README.md)
        if: steps.scope.outputs.run == 'true'
        run: python kg/sosa/build_sosa.py --check --out /tmp/workshop_sensors.sosa.ttl

      - name: Quality summary
        if: steps.scope.outputs.run == 'true' && always()
        run: |
          python kg/quality.py --json /tmp/quality.json --html /tmp/inspector.html > /tmp/quality.txt
          { echo '### KG quality (committed export)'; echo '```'; cat /tmp/quality.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Fresh anon export (informational)
        if: steps.scope.outputs.run == 'true'
        continue-on-error: true
        run: |
          python kg/export.py /tmp/fresh.ttl
          python kg/ci_check.py --export /tmp/fresh.ttl | tee /tmp/fresh.txt
          { echo '### Fresh anon export vs baseline'; echo '```'; cat /tmp/fresh.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

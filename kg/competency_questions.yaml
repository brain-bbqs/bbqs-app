# Competency questions: the fixed set of questions the BBQS KG must be able to answer.
# `python kg/quality.py` runs each one against an export and reports it as
#   answered  -- returned >= min_rows rows
#   empty     -- returned fewer, on an export that should be able to answer it: a real gap
#   n/a       -- `access: full` on an anon export (the source rows are RLS-hidden), not a gap
#   unmodeled -- the SPARQL uses a bbqs: term the TBox (bbqs.owl.ttl) doesn't declare: a schema gap
#   none      -- a question with `reads: absence` found nothing missing (see below)
#
# Every bbqs: term is a LinkML slot/class name, so an empty answer points at the exporter (the slot
# exists but isn't emitted) and an unmodeled one points at the schema (the slot doesn't exist).
# `access` is the weakest Supabase key whose reads can answer the question -- measured against the
# live tables (e.g. grant_investigators, investigators_public, and the public_jobs and
# public_job_posters views are anon-readable; field_provenance and the jobs table are not), never
# assumed.
#
# Questions are pinned to real entities (R34DA059723, House Mouse, WG-Devices) so a result is
# checkable against the site, not just "non-empty".
#
# CQ01-CQ19 are the first set. CQ20-CQ42 were proposed in #441 with their SPARQL and adopted in full.
# A question of the form "which X has no Y" (CQ21, CQ27, CQ30, CQ33, CQ38, CQ42) carries
# `reads: absence`: it lists every X for which no Y is RECORDED, which in a graph still being linked
# is not the same as "has none", and no rows means nothing is missing. The KG gate counts such a
# question as answering either way, so a gap being closed never fails it.

prefixes:
  bbqs: https://brain-bbqs.org/schema#
  bid: https://brain-bbqs.org/id/
  xsd: http://www.w3.org/2001/XMLSchema#

questions:
  # ── Projects ────────────────────────────────────────────────────────────────
  - id: CQ01
    area: projects
    question: Which projects are in the consortium, with grant number and mechanism?
    access: anon
    sparql: |
      SELECT ?project ?grant_number ?mechanism WHERE {
        ?project a bbqs:Project ; bbqs:grant_number ?grant_number .
        OPTIONAL { ?project bbqs:mechanism ?mechanism }
      } ORDER BY ?grant_number

  - id: CQ02
    area: projects
    question: What is the total award amount per mechanism?
    access: anon
    sparql: |
      SELECT ?mechanism (COUNT(?project) AS ?projects) (SUM(?amount) AS ?total) WHERE {
        ?project a bbqs:Project ; bbqs:mechanism ?mechanism ; bbqs:award_amount ?amount .
      } GROUP BY ?mechanism ORDER BY DESC(?total)

  - id: CQ03
    area: projects
    question: Which institution hosts each project?
    access: anon
    sparql: |
      SELECT ?project ?grant_number ?org_name WHERE {
        ?project a bbqs:Project ; bbqs:grant_number ?grant_number ; bbqs:part_of_org ?org .
        ?org bbqs:name ?org_name .
      }

  # ── People and roles ────────────────────────────────────────────────────────
  - id: CQ04
    area: people
    question: Who holds a role on R34DA059723, and what role?
    access: anon
    sparql: |
      SELECT ?name ?role WHERE {
        ?project bbqs:grant_number "R34DA059723" .
        ?pr a bbqs:ProjectRole ; bbqs:on_project ?project ; bbqs:project_role ?role ;
            bbqs:held_by ?person .
        ?person bbqs:name ?name .
      }

  - id: CQ05
    area: people
    question: Which investigators hold roles on more than one project?
    access: anon
    sparql: |
      SELECT ?name (COUNT(DISTINCT ?project) AS ?projects) WHERE {
        ?pr a bbqs:ProjectRole ; bbqs:held_by ?person ; bbqs:on_project ?project .
        ?person bbqs:name ?name .
      } GROUP BY ?person ?name HAVING (COUNT(DISTINCT ?project) > 1) ORDER BY DESC(?projects)

  - id: CQ06
    area: people
    question: Which organization is each investigator affiliated with?
    access: anon
    sparql: |
      SELECT ?name ?org_name WHERE {
        ?org a bbqs:ResearchOrganization ; bbqs:name ?org_name ; bbqs:members ?person .
        ?person a bbqs:Investigator ; bbqs:name ?name .
      }

  - id: CQ07
    area: people
    question: Which investigators have an ORCID?
    access: anon
    sparql: |
      SELECT ?name ?orcid WHERE {
        ?person a bbqs:Investigator ; bbqs:name ?name ; bbqs:orcid ?orcid .
      }

  # ── Working groups ──────────────────────────────────────────────────────────
  - id: CQ08
    area: working_groups
    question: Who are the members of WG-Devices?
    access: anon
    sparql: |
      SELECT ?name WHERE {
        ?wg a bbqs:WorkingGroup ; bbqs:name "WG-Devices" .
        ?person bbqs:member_of_group ?wg ; bbqs:name ?name .
      }

  # ── Species ─────────────────────────────────────────────────────────────────
  - id: CQ09
    area: species
    question: Which projects study the house mouse?
    access: anon
    sparql: |
      SELECT ?project ?grant_number WHERE {
        ?species a bbqs:Species ; bbqs:common_name "House Mouse" .
        ?project bbqs:studies_species ?species ; bbqs:grant_number ?grant_number .
      }

  - id: CQ10
    area: species
    question: Which projects study mammals?
    access: anon
    sparql: |
      SELECT DISTINCT ?project ?grant_number WHERE {
        ?species a bbqs:Species ; bbqs:taxonomy_class "Mammalia" .
        ?project bbqs:studies_species ?species ; bbqs:grant_number ?grant_number .
      }

  - id: CQ11
    area: species
    question: Which projects name no resolvable species, and is that by design?
    access: anon
    sparql: |
      SELECT ?project ?grant_number ?scope WHERE {
        ?project a bbqs:Project ; bbqs:grant_number ?grant_number .
        FILTER NOT EXISTS { ?project bbqs:studies_species ?s }
        OPTIONAL { ?project bbqs:study_scope ?scope }
      }

  # ── Products: publications, datasets, software, devices ─────────────────────
  - id: CQ12
    area: products
    question: Which publications came out of which project?
    access: anon
    sparql: |
      SELECT ?grant_number ?title WHERE {
        ?project a bbqs:Project ; bbqs:grant_number ?grant_number ; bbqs:produced ?pub .
        ?pub a bbqs:Publication ; bbqs:title ?title .
      }

  - id: CQ13
    area: products
    question: Which datasets were produced under which project?
    access: anon
    sparql: |
      SELECT ?grant_number ?dataset_name WHERE {
        ?project a bbqs:Project ; bbqs:grant_number ?grant_number ;
                 (bbqs:funded_datasets|bbqs:produced) ?dataset .
        ?dataset a bbqs:Dataset ; bbqs:name ?dataset_name .
      }

  - id: CQ14
    area: products
    question: Which device categories does each project use?
    access: anon  # project_device_usage is anon-readable; exported as Project uses_device_category
    sparql: |
      SELECT ?grant_number ?category WHERE {
        ?project a bbqs:Project ; bbqs:grant_number ?grant_number ; bbqs:uses_device_category ?cat .
        ?cat bbqs:label ?category .
      }

  - id: CQ15
    area: products
    question: Which devices does each manufacturer make, by category?
    access: anon
    sparql: |
      SELECT ?manufacturer ?model ?category WHERE {
        ?device a bbqs:Device ; bbqs:model_name ?model ; bbqs:manufacturer ?m .
        ?m bbqs:name ?manufacturer .
        OPTIONAL { ?device bbqs:device_category ?category }
      }

  - id: CQ16
    area: products
    question: Which software tools does the consortium provide, with their repositories?
    access: anon
    sparql: |
      SELECT ?name ?repo WHERE {
        ?tool a bbqs:SoftwareTool ; bbqs:name ?name ; bbqs:repo_url ?repo .
      }

  # ── Announcements: funding calls, jobs, news ────────────────────────────────
  - id: CQ17
    area: announcements
    question: Which funding opportunities are still open (expiration after 2026-09-29)?
    access: anon
    sparql: |
      SELECT ?title ?expires WHERE {
        ?fo a bbqs:FundingOpportunity ; bbqs:name ?title ; bbqs:expiration_date ?expires .
        FILTER (?expires > "2026-09-29"^^xsd:date)
      }

  - id: CQ18
    area: announcements
    question: Which jobs are posted, and by which institution?
    # The institution is the job's part_of_org link (resources / public_jobs .organization_id), read as
    # that organization's name. job_institution, the institution as the posting writes it, is only
    # exported for a job with no such link (link, don't copy), so it is read only then.
    access: anon
    sparql: |
      SELECT ?title ?institution WHERE {
        ?job a bbqs:Job ; bbqs:name ?title .
        { ?job bbqs:part_of_org ?org . ?org bbqs:name ?institution }
        UNION
        { ?job bbqs:job_institution ?institution . FILTER NOT EXISTS { ?job bbqs:part_of_org ?linked } }
      }

  # ── Provenance ──────────────────────────────────────────────────────────────
  - id: CQ19
    area: provenance
    question: Where did R34DA059723's title come from (source class and grade)?
    access: full
    sparql: |
      SELECT ?value ?source ?grade WHERE {
        ?project bbqs:grant_number "R34DA059723" .
        BIND(STRAFTER(STR(?project), "https://brain-bbqs.org/id/") AS ?localId)
        ?prov a bbqs:ProvenanceRecord ; bbqs:prov_entity_id ?localId ;
              bbqs:prov_entity_column "title" ; bbqs:prov_value_text ?value ;
              bbqs:prov_source_class ?source .
        OPTIONAL { ?source bbqs:grade ?grade }
      }

  # ── Investigators and membership ────────────────────────────────────────────
  - id: CQ20
    area: people
    question: Which investigators are on more than one project, and which projects?
    access: anon
    sparql: |
      SELECT ?name (GROUP_CONCAT(DISTINCT ?grant; separator=", ") AS ?projects) WHERE {
        ?pr a bbqs:ProjectRole ; bbqs:held_by ?person ; bbqs:on_project ?project .
        ?person bbqs:name ?name . ?project bbqs:grant_number ?grant .
      } GROUP BY ?person ?name HAVING (COUNT(DISTINCT ?project) > 1) ORDER BY ?name

  - id: CQ21
    area: people
    question: Which investigators have no ORCID recorded?
    access: anon
    reads: absence
    sparql: |
      SELECT ?name WHERE {
        ?person a bbqs:Investigator ; bbqs:name ?name .
        FILTER NOT EXISTS { ?person bbqs:orcid ?o }
      } ORDER BY ?name

  - id: CQ22
    area: people
    question: Which organization is each investigator tied to, directly or through a project?
    access: anon
    sparql: |
      SELECT DISTINCT ?name ?org_name WHERE {
        ?person a bbqs:Investigator ; bbqs:name ?name .
        { ?org bbqs:members ?person }
        UNION
        { ?pr bbqs:held_by ?person ; bbqs:on_project ?p . ?p bbqs:part_of_org ?org }
        ?org bbqs:name ?org_name .
      } ORDER BY ?org_name ?name

  - id: CQ23
    area: working_groups
    question: Who is in each working group, and on which projects are they?
    access: anon
    sparql: |
      SELECT ?wg_name ?name ?grant WHERE {
        ?wg a bbqs:WorkingGroup ; bbqs:name ?wg_name .
        ?person bbqs:member_of_group ?wg ; bbqs:name ?name .
        OPTIONAL { ?pr bbqs:held_by ?person ; bbqs:on_project ?p . ?p bbqs:grant_number ?grant }
      } ORDER BY ?wg_name ?name

  - id: CQ24
    area: people
    question: Which investigators hold more than one kind of role?
    access: anon
    sparql: |
      SELECT ?name (GROUP_CONCAT(DISTINCT ?role; separator=", ") AS ?roles) WHERE {
        ?pr a bbqs:ProjectRole ; bbqs:held_by ?person ; bbqs:project_role ?role .
        ?person bbqs:name ?name .
      } GROUP BY ?person ?name HAVING (COUNT(DISTINCT ?role) > 1) ORDER BY ?name

  # ── Species ─────────────────────────────────────────────────────────────────
  - id: CQ25
    area: species
    question: Which projects study the house mouse, whichever of its names is used?
    access: anon
    sparql: |
      SELECT ?grant ?title WHERE {
        ?sp a bbqs:Species .
        { ?sp bbqs:name "Mus musculus" } UNION { ?sp bbqs:common_name "House Mouse" } UNION { ?sp bbqs:aliases "Mus musculus" }
        ?project bbqs:studies_species ?sp ; bbqs:grant_number ?grant .
        OPTIONAL { ?project bbqs:title ?title }
      } ORDER BY ?grant

  - id: CQ26
    area: species
    question: How many projects study each species?
    access: anon
    sparql: |
      SELECT ?species (COUNT(DISTINCT ?project) AS ?projects) WHERE {
        ?project a bbqs:Project ; bbqs:studies_species ?sp .
        ?sp bbqs:name ?species .
      } GROUP BY ?species ORDER BY DESC(?projects)

  - id: CQ27
    area: species
    question: Which projects name a species in free text that is not resolved to a species node?
    access: anon
    reads: absence
    sparql: |
      SELECT ?grant ?raw WHERE {
        ?project a bbqs:Project ; bbqs:grant_number ?grant ; bbqs:studies_species_unresolved ?raw .
      } ORDER BY ?grant ?raw

  # ── Outputs ─────────────────────────────────────────────────────────────────
  - id: CQ28
    area: products
    question: How many publications, datasets, tools and models did each project produce?
    access: anon
    sparql: |
      SELECT ?grant
        (COUNT(DISTINCT ?pub) AS ?publications) (COUNT(DISTINCT ?ds) AS ?datasets)
        (COUNT(DISTINCT ?tool) AS ?tools) (COUNT(DISTINCT ?model) AS ?models) WHERE {
        ?project a bbqs:Project ; bbqs:grant_number ?grant .
        OPTIONAL { ?project bbqs:produced ?pub   . ?pub   a bbqs:Publication }
        OPTIONAL { ?project bbqs:produced ?ds    . ?ds    a bbqs:Dataset }
        OPTIONAL { ?project bbqs:produced ?tool  . ?tool  a bbqs:SoftwareTool }
        OPTIONAL { ?project bbqs:produced ?model . ?model a bbqs:MLModel }
      } GROUP BY ?grant ORDER BY ?grant

  - id: CQ29
    area: products
    question: How many publications came out of each investigator's projects, and which projects?
    access: anon
    sparql: |
      SELECT ?name (COUNT(DISTINCT ?pub) AS ?publications) (GROUP_CONCAT(DISTINCT ?grant; separator=", ") AS ?projects) WHERE {
        ?pr a bbqs:ProjectRole ; bbqs:held_by ?person ; bbqs:on_project ?project .
        ?person bbqs:name ?name . ?project bbqs:grant_number ?grant ; bbqs:produced ?pub .
        ?pub a bbqs:Publication .
      } GROUP BY ?person ?name ORDER BY DESC(?publications)

  - id: CQ30
    area: provenance
    question: Which produced datasets have no provenance recorded?
    access: full
    reads: absence
    sparql: |
      SELECT ?ds ?name WHERE {
        ?project bbqs:produced ?ds . ?ds a bbqs:Dataset ; bbqs:name ?name .
        BIND(STRAFTER(STR(?ds), "https://brain-bbqs.org/id/") AS ?localId)
        FILTER NOT EXISTS { ?prov a bbqs:ProvenanceRecord ; bbqs:prov_entity_id ?localId ; bbqs:prov_source_class ?sc }
      }

  - id: CQ31
    area: products
    question: Which benchmarks is each ML model evaluated by, and which project produced it?
    access: anon
    sparql: |
      SELECT ?model_name ?bench_name ?grant WHERE {
        ?model a bbqs:MLModel ; bbqs:name ?model_name .
        { ?model bbqs:evaluated_by ?bench } UNION { ?bench bbqs:evaluates ?model }
        ?bench a bbqs:Benchmark ; bbqs:name ?bench_name .
        OPTIONAL { ?project bbqs:produced ?model ; bbqs:grant_number ?grant }
      }

  # ── Organizations ───────────────────────────────────────────────────────────
  - id: CQ32
    area: organizations
    question: How many members does each organization have?
    access: anon
    sparql: |
      SELECT ?org_name (COUNT(DISTINCT ?person) AS ?members) WHERE {
        ?org a bbqs:ResearchOrganization ; bbqs:name ?org_name .
        OPTIONAL { ?org bbqs:members ?person }
      } GROUP BY ?org ?org_name ORDER BY DESC(?members)

  - id: CQ33
    area: organizations
    question: Which organizations have no members recorded?
    access: anon
    reads: absence
    sparql: |
      SELECT ?org_name WHERE {
        ?org a bbqs:ResearchOrganization ; bbqs:name ?org_name .
        FILTER NOT EXISTS { ?org bbqs:members ?p }
      } ORDER BY ?org_name

  - id: CQ34
    area: organizations
    question: Which organizations have investigators on more than one project?
    access: anon
    sparql: |
      SELECT ?org_name (COUNT(DISTINCT ?project) AS ?projects) WHERE {
        ?org a bbqs:ResearchOrganization ; bbqs:name ?org_name ; bbqs:members ?person .
        ?pr bbqs:held_by ?person ; bbqs:on_project ?project .
      } GROUP BY ?org ?org_name HAVING (COUNT(DISTINCT ?project) > 1) ORDER BY DESC(?projects)

  # ── Jobs ────────────────────────────────────────────────────────────────────
  - id: CQ35
    area: announcements
    question: Which jobs does each institution advertise?
    # The institution as CQ18 reads it. Grouped by the organization node as well as its name, so two
    # organizations of one name stay two, and a name written as text is not taken for the node.
    access: anon
    sparql: |
      SELECT ?institution (COUNT(?job) AS ?jobs) (GROUP_CONCAT(?title; separator="; ") AS ?titles) WHERE {
        ?job a bbqs:Job ; bbqs:name ?title .
        { ?job bbqs:part_of_org ?org . ?org bbqs:name ?institution }
        UNION
        { ?job bbqs:job_institution ?institution . FILTER NOT EXISTS { ?job bbqs:part_of_org ?linked } }
      } GROUP BY ?org ?institution ORDER BY DESC(?jobs)

  - id: CQ36
    area: announcements
    question: Which kinds of role are being advertised?
    access: anon  # job_type, from the public_jobs view
    sparql: |
      SELECT ?job_type (COUNT(?job) AS ?postings) WHERE {
        ?job a bbqs:Job ; bbqs:job_type ?job_type .
      } GROUP BY ?job_type ORDER BY DESC(?postings)

  - id: CQ37
    area: announcements
    question: Who posted each job?
    # posted_by is a link to the poster's Investigator node, read as their name. Its anon source is
    # the public_job_posters view (20261117170000), which pairs spine rows and nothing else:
    # jobs.posted_by (an auth user id) and the contact fields stay hidden (20260515233153).
    access: anon
    sparql: |
      SELECT ?title ?poster WHERE {
        ?job a bbqs:Job ; bbqs:name ?title ; bbqs:posted_by ?person .
        ?person bbqs:name ?poster .
      }

  # ── Data quality and diagnostics ────────────────────────────────────────────
  - id: CQ38
    area: diagnostics
    question: Which projects have no outputs recorded?
    access: anon
    reads: absence
    sparql: |
      SELECT ?grant WHERE {
        ?project a bbqs:Project ; bbqs:grant_number ?grant .
        FILTER NOT EXISTS { ?project bbqs:produced ?o }
      } ORDER BY ?grant

  - id: CQ39
    area: announcements
    question: Which funding opportunities expire between 2026-10-14 and 2027-04-14?
    access: anon
    sparql: |
      SELECT ?title ?expires WHERE {
        VALUES (?today ?horizon) { ("2026-10-14"^^xsd:date "2027-04-14"^^xsd:date) }
        ?fo a bbqs:FundingOpportunity ; bbqs:name ?title ; bbqs:expiration_date ?expires .
        FILTER (?expires >= ?today && ?expires <= ?horizon)
      } ORDER BY ?expires

  - id: CQ40
    area: provenance
    question: How many values come from a source graded below 3, by source and table?
    access: full
    sparql: |
      SELECT ?source ?grade ?type (COUNT(?prov) AS ?records) WHERE {
        ?prov a bbqs:ProvenanceRecord ; bbqs:prov_source_class ?source .
        ?source bbqs:grade ?grade .
        OPTIONAL { ?prov bbqs:prov_entity_table ?type }
        FILTER (?grade < 3)
      } GROUP BY ?source ?grade ?type ORDER BY ?grade

  - id: CQ41
    area: products
    question: Which datasets did each grant fund, and who are its PIs?
    access: anon
    sparql: |
      SELECT ?grant ?ds_name ?pi WHERE {
        ?project a bbqs:Project ; bbqs:grant_number ?grant ; bbqs:funded_datasets ?ds .
        OPTIONAL { ?ds bbqs:name ?ds_name }
        OPTIONAL {
          ?pr bbqs:on_project ?project ; bbqs:project_role ?role ; bbqs:held_by ?person .
          ?person bbqs:name ?pi . FILTER (CONTAINS(LCASE(STR(?role)), "pi"))
        }
      } ORDER BY ?grant

  - id: CQ42
    area: diagnostics
    question: Which working groups have no member with a role on any project?
    access: anon
    reads: absence
    sparql: |
      SELECT ?wg_name WHERE {
        ?wg a bbqs:WorkingGroup ; bbqs:name ?wg_name .
        FILTER NOT EXISTS {
          ?person bbqs:member_of_group ?wg .
          ?pr bbqs:held_by ?person ; bbqs:on_project ?p .
        }
      }

  draft_url:   { range: uriorcurie }
  neurosift_url: { range: uriorcurie }
  file_count:  { range: integer }
  size_bytes:  { slot_uri: schema:contentSize, range: integer }
  dandi_instance: {}
  award_numbers: { multivalued: true, description: "Award number(s) behind this resource: a dandiset's grants, a standard's funding award." }
  evaluates:   { slot_uri: bbqs:evaluates, range: Entity, multivalued: true, description: "What the benchmark scores (model/algorithm/tool)." }
  repo_url:    { slot_uri: schema:codeRepository, range: uriorcurie }
  docs_url:    { slot_uri: schema:url, range: uriorcurie }
  language:    { slot_uri: schema:programmingLanguage }
  software_license: { slot_uri: schema:license }
  version:     { slot_uri: schema:softwareVersion }
  trained_on:  { slot_uri: bbqs:trainedOn, range: Dataset, multivalued: true }
  evaluated_by: { slot_uri: bbqs:evaluatedBy, range: Benchmark, multivalued: true }

  # ---- devices --------------------------------------------------------------
  device_category: { slot_uri: schema:category, range: DeviceCategory, description: "device_models.device_class → DeviceCategory.key." }
  manufacturer: { slot_uri: schema:manufacturer, range: DeviceManufacturer }
  model_name:  { slot_uri: schema:model }
  output_signals: { multivalued: true }
  sampling_rate_hz: { range: float }
  price_tier:  { description: "Relative cost tier (device_models.price_tier) — a bucket, not a currency amount." }
  regulatory_class: { description: "Regulatory classification (e.g. an FDA device class), where applicable." }
  product_url: { slot_uri: schema:url, range: uriorcurie }
  manual_urls: { range: uriorcurie, multivalued: true }
  sdk_urls:    { range: uriorcurie, multivalued: true }
  category_key: { slot_uri: skos:notation, description: "device_categories.key." }
  label:       { slot_uri: skos:prefLabel }
  measures:    { slot_uri: bbqs:measures, multivalued: true, description: "What this device category measures (behavior/neural/physio…)." }
  typical_use_cases: { multivalued: true }
  schema_org_type: { description: "device_categories.schema_org_type — the schema.org type this category maps to." }
  uses_device: { slot_uri: schema:instrument, range: Device, multivalued: true }
  uses_device_category: { slot_uri: bbqs:usesDeviceCategory, range: DeviceCategory, multivalued: true, description: "A kind of instrument the project's methods evidence names (the project_device_usage view): a category, not a model." }
  measures_construct: { slot_uri: bbqs:measuresConstruct, range: BehavioralConstruct, multivalued: true }

  # ---- community / notices --------------------------------------------------
  content:     { slot_uri: schema:articleBody }
  link:        { slot_uri: schema:url, range: uriorcurie }
  link_text:   { description: "Display text for `link`, when the announcement points off-site." }
  is_external_link: { range: boolean }
  posted_by:   { slot_uri: schema:author, range: Investigator, description: "Who posted it, as a link to their Investigator node (for a job: the public_job_posters view, 20261117170000). Never the poster's auth user id (jobs.posted_by) or email." }
  job_institution: { slot_uri: schema:hiringOrganization, description: "The institution a job posting names, as written (jobs.institution), for a job with no organization node to link. A job whose organization resolves has the part_of_org link instead, and the name is not repeated as text (link, do not copy). A curator clears one by setting the job's organization." }
  job_type:    { slot_uri: schema:employmentType }
  department:  { description: "Posting lab's department, as free text (jobs.department)." }
  location:    { slot_uri: schema:jobLocation }
  description_text: { slot_uri: schema:description }
  # P01 (OOPS): Event must not reuse Job's `location` (schema:jobLocation) for a venue.
  venue:       { slot_uri: schema:location, description: "Physical or virtual venue for the workshop/convening." }
  application_url: { slot_uri: schema:url, range: uriorcurie }
  contact_name: { description: "Name of the person to contact about the posting. Restricted: public_jobs leaves it out (20260515233153), so the public export never carries it." }

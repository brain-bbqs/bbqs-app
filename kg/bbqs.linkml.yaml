  prov_source_ref: {}
  prov_confidence: { range: float }
  prov_authored_at: { range: datetime }
  prov_recorded_at: { range: datetime }
  prov_recorded_by: {}
  prov_evidence: {}
  prov_model_id: {}
  source_code: { slot_uri: skos:notation }

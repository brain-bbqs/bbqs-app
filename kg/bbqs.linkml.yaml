  is_active:   { range: boolean }
  fon:         { slot_uri: schema:identifier, description: "Funding Opportunity Number." }
  activity_code: { description: "NIH activity code for the funding opportunity (e.g. R01, U01)." }
  eligible_activity_codes: { multivalued: true }
  announcement_type: { description: "Category of announcement (e.g. news, funding, event) — free text." }
  budget_floor: { range: float }
  budget_ceiling: { range: float }
  due_dates:   { description: "JSON of application due dates." }
  open_date:   { range: date }
  posted_date: { range: date }
  expiration_date: { range: date }
  participating_orgs: { multivalued: true }
  purpose:     { description: "Free-text statement of the funding opportunity's purpose." }
  relevance_tags: { multivalued: true }
  status:      { description: "Current lifecycle status of the funding opportunity (e.g. open, closed, forecasted)." }
  url:         { slot_uri: schema:url, range: uriorcurie }

  # ---- events ---------------------------------------------------------------
  start_date:  { slot_uri: schema:startDate, range: date }
  end_date:    { slot_uri: schema:endDate, range: date }
  attendees:   { slot_uri: schema:attendee, range: Investigator, multivalued: true }

  # ---- species / ideas ------------------------------------------------------
  common_name: { slot_uri: schema:alternateName }

  taxonomy_family: { description: "Linnaean family for the species (e.g. Muridae)." }
  taxonomy_genus: { description: "Linnaean genus for the species (e.g. Mus)." }

  # ---- Marr stub hooks ------------------------------------------------------
  describes_project: { slot_uri: schema:about, range: Project }
  computational_level: { description: "Marr level 1 — the problem/goal. RESERVED." }
  algorithmic_level: { description: "Marr level 2 — representation & algorithm. RESERVED." }
  implementational_level: { description: "Marr level 3 — physical realization. RESERVED." }
  has_experimental_data: { range: ExperimentalData, multivalued: true }
  about_construct: { range: BehavioralConstruct, multivalued: true }
  about_anatomy: { range: AnatomicalSite, multivalued: true }
  about_task:  { range: CognitiveTask, multivalued: true }

  # ---- provenance record (field_provenance) --------------------------------
  prov_entity_table: {}
  prov_entity_column: {}
  prov_entity_id: {}
  prov_value_text: {}
  prov_activity: { slot_uri: prov:activity }
  prov_agent_id: {}
  prov_agent_label: { slot_uri: prov:agent }
  prov_source_class: { slot_uri: prov:hadPrimarySource, range: SourceClass }
  prov_source_ref: {}
  prov_confidence: { range: float }
  prov_authored_at: { range: datetime }
  prov_recorded_at: { range: datetime }
  prov_recorded_by: {}
  prov_evidence: {}
  prov_model_id: {}

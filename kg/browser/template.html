<title>BBQS Graph Inspector</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  /* Layout: a summary strip on top, then tabs; the Entities tab is facets | card list | detail pane. */
  :root {
    --bg: #f5f6f8; --surface: #ffffff; --sunk: #eceff3; --line: #d9dee5;
    --fg: #16202b; --muted: #5a6677; --accent: #1d5fa8; --accent-soft: #e3edf8;
    --ok: #1d7a4e; --ok-soft: #e2f3ea; --warn: #9a5b00; --warn-soft: #fbefd9;
    --bad: #b3261e; --bad-soft: #fbe5e3; --na: #6b7280; --na-soft: #eceef1;
    --c-people: #7a4fb5; --c-org: #a1557a; --c-project: #1d5fa8; --c-species: #2f7d5b;
    --c-product: #a8620f; --c-announce: #5a6d1f; --c-prov: #4b5563;
    --f-display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
    --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --f-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #11161d; --surface: #182029; --sunk: #0d1218; --line: #2a3542;
    --fg: #e4e9f0; --muted: #98a4b4; --accent: #6aa6ea; --accent-soft: #1b2c42;
    --ok: #5cc28e; --ok-soft: #15301f; --warn: #e2a84b; --warn-soft: #33260f;
    --bad: #f07a70; --bad-soft: #3a1a18; --na: #9aa3af; --na-soft: #222a33;
    --c-people: #b596e3; --c-org: #d88fb2; --c-project: #6aa6ea; --c-species: #6cc79c;
    --c-product: #e3a255; --c-announce: #b3c56a; --c-prov: #a3acb9;
    color-scheme: dark;
  } }
  :root[data-theme="dark"] {
    --bg: #11161d; --surface: #182029; --sunk: #0d1218; --line: #2a3542;
    --fg: #e4e9f0; --muted: #98a4b4; --accent: #6aa6ea; --accent-soft: #1b2c42;
    --ok: #5cc28e; --ok-soft: #15301f; --warn: #e2a84b; --warn-soft: #33260f;
    --bad: #f07a70; --bad-soft: #3a1a18; --na: #9aa3af; --na-soft: #222a33;
    --c-people: #b596e3; --c-org: #d88fb2; --c-project: #6aa6ea; --c-species: #6cc79c;
    --c-product: #e3a255; --c-announce: #b3c56a; --c-prov: #a3acb9;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { background: var(--bg); color: var(--fg); }
  body { font: 14px/1.5 var(--f-body); margin: 0; }
  .wrap { max-width: 1440px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 48px; display: grid; gap: 18px; }
  h1, h2, h3 { font-family: var(--f-display); font-weight: 600; text-wrap: balance; margin: 0; }
  h1 { font-size: 26px; letter-spacing: .005em; }
  h2 { font-size: 18px; }
  h3 { font-size: 15px; }
  .mono, code, pre { font-family: var(--f-mono); font-size: 12.5px; }
  .muted { color: var(--muted); }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  header.top { display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: baseline; justify-content: space-between; }
  header.top p { margin: 0; color: var(--muted); max-width: 70ch; }
  .src { font-family: var(--f-mono); font-size: 12px; color: var(--muted); display: grid; gap: 2px; justify-items: end; text-align: right; }
  .src a { color: var(--muted); }
  .src .pill { font-family: var(--f-body); }
  @media (max-width: 720px) { .src { justify-items: start; text-align: left; } }

  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
  .tile { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; display: grid; gap: 2px; }
  .tile b { font: 600 24px/1.1 var(--f-display); font-variant-numeric: tabular-nums; }
  .tile span { font-size: 12px; color: var(--muted); }
  .tile.bad b { color: var(--bad); } .tile.warn b { color: var(--warn); } .tile.ok b { color: var(--ok); }

  nav.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; }
  nav.tabs button { background: none; border: 0; padding: 8px 14px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; font-weight: 500; }
  nav.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
  nav.tabs .n { font-family: var(--f-mono); font-size: 11px; color: var(--muted); margin-left: 4px; }

  .pill { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 500; padding: 1px 8px; border-radius: 999px; white-space: nowrap; border: 1px solid transparent; }
  .pill.ok { background: var(--ok-soft); color: var(--ok); }
  .pill.warn { background: var(--warn-soft); color: var(--warn); }
  .pill.bad { background: var(--bad-soft); color: var(--bad); }
  .pill.na { background: var(--na-soft); color: var(--na); }
  .pill.cls { background: transparent; border-color: currentColor; }
  .swatch { width: 8px; height: 8px; border-radius: 2px; background: currentColor; display: inline-block; flex: none; }

  /* Entities */
  .ent { display: grid; grid-template-columns: 220px minmax(0, 1fr) minmax(0, 1.15fr); gap: 16px; align-items: start; }
  .facets { display: grid; gap: 16px; position: sticky; top: env(safe-area-inset-top, 0px); }
  .facets fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: 2px; }
  .facets legend { font: 600 11px/1 var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; padding: 0; }
  .facets label { display: flex; align-items: center; gap: 8px; padding: 2px 4px; border-radius: 4px; cursor: pointer; }
  .facets label:hover { background: var(--sunk); }
  .facets label .c { margin-left: auto; font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .facets input[type="checkbox"] { margin: 0; accent-color: var(--accent); }
  .search { width: 100%; padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--fg); font: inherit; }
  .linkbtn { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; font-size: 12.5px; text-align: left; }

  .list { display: grid; gap: 6px; min-width: 0; }
  .list .meta { font-size: 12.5px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; cursor: pointer; text-align: left; width: 100%; }
  .card:hover { border-color: var(--muted); }
  .card[aria-current="true"] { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
  .card .lbl { font-weight: 500; overflow-wrap: anywhere; }
  .card .sub { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); }
  .card .deg { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; align-self: center; }
  .more { justify-self: start; }

  .detail { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 16px; display: grid; gap: 14px; min-width: 0; position: sticky; top: env(safe-area-inset-top, 0px); max-height: calc(100vh - 24px); overflow: auto; }
  .detail .iri { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .detail .iri code { overflow-wrap: anywhere; color: var(--muted); }
  .detail section { display: grid; gap: 6px; }
  .detail section > h3 { font: 600 11px/1 var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .kv { display: grid; grid-template-columns: minmax(110px, max-content) minmax(0, 1fr); gap: 4px 14px; margin: 0; }
  .kv dt { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
  .kv dd { margin: 0; overflow-wrap: anywhere; }
  .edge { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .edge .p { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
  .viol { border-left: 3px solid var(--bad); background: var(--bad-soft); padding: 6px 10px; border-radius: 0 4px 4px 0; display: grid; gap: 2px; }
  .viol b { font-family: var(--f-mono); font-size: 12px; font-weight: 500; color: var(--bad); }
  .viol.w { border-left-color: var(--warn); background: var(--warn-soft); }
  .viol.w b { color: var(--warn); }
  pre.ttl { background: var(--sunk); border: 1px solid var(--line); border-radius: 4px; padding: 10px; margin: 0; overflow-x: auto; white-space: pre; line-height: 1.45; }
  .empty { color: var(--muted); font-style: italic; }
  .note { font-size: 12.5px; color: var(--muted); }
  .copy { background: var(--sunk); border: 1px solid var(--line); border-radius: 4px; padding: 1px 8px; font-size: 12px; cursor: pointer; }
  .flagbox { display: grid; gap: 8px; border: 1px solid var(--line); border-radius: 6px; padding: 10px; background: var(--sunk); }
  .flagbox select, .flagbox textarea { font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; }
  .flagbox textarea { width: 100%; min-height: 64px; resize: vertical; }
  .flagbox .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .btn { border: 1px solid var(--accent); background: var(--accent); color: var(--surface); border-radius: 4px; padding: 4px 12px; cursor: pointer; font-size: 12.5px; font-weight: 500; }
  .btn.ghost { background: transparent; color: var(--accent); }
  .pill.flag { background: var(--accent-soft); color: var(--accent); }
  .now { display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; font-size: 12.5px; }

  /* Tables */
  .tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font: 600 11px/1.3 var(--f-body); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); background: var(--sunk); white-space: nowrap; }
  tr:last-child td { border-bottom: 0; }
  td.num, th.num { text-align: right; }
  .bar { height: 6px; background: var(--sunk); border-radius: 3px; overflow: hidden; min-width: 80px; }
  .bar i { display: block; height: 100%; background: var(--bad); }

  /* Questions */
  .qgroup { display: grid; gap: 8px; }
  .qgroup > h2 { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-family: var(--f-body); }
  details.q { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }
  details.q > summary { list-style: none; cursor: pointer; padding: 10px 12px; display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 10px; align-items: baseline; }
  details.q > summary::-webkit-details-marker { display: none; }
  details.q > summary .id { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
  details.q > summary .right { display: flex; gap: 8px; align-items: center; }
  details.q > summary .rc { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); }
  details.q[open] > summary { border-bottom: 1px solid var(--line); }
  details.q .body { padding: 12px; display: grid; gap: 10px; min-width: 0; }
  details.q pre { background: var(--sunk); border: 1px solid var(--line); border-radius: 4px; padding: 10px; margin: 0; overflow-x: auto; }
  .filters { display: flex; flex-wrap: wrap; gap: 6px; }
  .filters button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 12px; cursor: pointer; font-size: 12.5px; }
  .filters button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12.5px; color: var(--muted); }
  .legend span { display: inline-flex; gap: 6px; align-items: center; }

  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 16px; align-items: start; }
  .panel { display: grid; gap: 8px; min-width: 0; }

  /* Publications and Meetings */
  .intro { margin: 0; max-width: 78ch; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .textbox { background: var(--sunk); border: 1px solid var(--line); border-radius: 4px; padding: 12px 14px; max-height: 60vh; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13.5px; line-height: 1.6; max-width: 80ch; }
  details.q > summary .right { flex-wrap: wrap; justify-content: flex-end; }
  .meet { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 16px; align-items: start; }
  .facets select.search { padding: 6px 8px; }
  .mtg { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 10px 14px; display: grid; gap: 8px; min-width: 0; }
  .mtg header { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
  .mtg .date { font-family: var(--f-mono); font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .pt { display: grid; grid-template-columns: 116px minmax(0, 1fr); gap: 2px 12px; padding-top: 8px; border-top: 1px solid var(--line); }
  .pt .kind { display: inline-flex; gap: 6px; align-items: center; align-self: start; font: 600 11px/1.9 var(--f-body); letter-spacing: .06em; text-transform: uppercase; }
  mark.q { background: var(--accent-soft); color: inherit; padding: 0 2px; border-radius: 2px; }
  .who { display: inline-flex; gap: 6px; align-items: baseline; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 1px 9px; font-size: 12.5px; cursor: pointer; }
  .who:hover { border-color: var(--muted); }
  .who .how { font-size: 10px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
  .who[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  .who.unres { border-style: dashed; color: var(--warn); cursor: help; }
  .linkbtn.quiet { color: var(--muted); font-size: 12px; }
  .linkbtn.quiet:hover, .linkbtn.quiet:focus-visible { color: var(--accent); }

  @media (max-width: 1100px) {
    .ent { grid-template-columns: 200px minmax(0, 1fr); }
    .meet { grid-template-columns: 200px minmax(0, 1fr); }
    .detail { grid-column: 1 / -1; position: static; max-height: none; }
  }
  @media (max-width: 720px) {
    .ent { grid-template-columns: minmax(0, 1fr); }
    .meet { grid-template-columns: minmax(0, 1fr); }
    .pt { grid-template-columns: minmax(0, 1fr); }
    .facets { position: static; }
    details.q > summary { grid-template-columns: 44px minmax(0, 1fr); }
    details.q > summary .right { grid-column: 2; }
  }
  @media (prefers-reduced-motion: no-preference) { .card, nav.tabs button { transition: border-color .12s, color .12s; } }
</style>

<div class="wrap">
  <header class="top">
    <div style="display:grid;gap:4px">
      <h1>BBQS Graph Inspector</h1>
      <p>Every node in the exported BBQS knowledge graph, with the structural, competency and consistency checks that <span class="mono">kg/quality.py</span> ran on it.</p>
      <p class="note" id="internal-note" style="margin:0" hidden></p>
    </div>
    <div class="src" id="src"></div>
  </header>

  <div class="tiles" id="tiles"></div>

  <nav class="tabs" role="tablist" id="tabs"></nav>

  <main id="view"></main>
</div>

<script>
const REPORT = /*__REPORT__*/null;
// The artifact build's internal records (kg/quality.py --internal): the working-group meeting notes.
// null on the public site and in the repo's copy.
const INTERNAL = /*__INTERNAL__*/null;
const PUBS = REPORT && REPORT.publications && Array.isArray(REPORT.publications.rows) ? REPORT.publications : null;
const MT = INTERNAL && INTERNAL.kind === "bbqs-meetings" && Array.isArray(INTERNAL.items) ? INTERNAL : null;

const AREA = {
  Investigator: "people", ProjectRole: "people", WorkingGroup: "people",
  ResearchOrganization: "org", DeviceManufacturer: "org",
  Project: "project", Species: "species",
  Publication: "product", Dataset: "product", SoftwareTool: "product", Tool: "product", MLModel: "product",
  Benchmark: "product", Protocol: "product", Device: "product", DeviceCategory: "product",
  Announcement: "announce", Job: "announce", FundingOpportunity: "announce", Event: "announce",
  ProvenanceRecord: "prov", SourceClass: "prov",
};
const AREA_NAME = { people: "People & roles", org: "Organizations", project: "Projects", species: "Species",
  product: "Products", announce: "Announcements", prov: "Provenance", other: "Other" };
const FLAG = {
  isolated: { cls: "warn", text: "isolated", tip: "No link to or from any other node" },
  dangling: { cls: "bad", text: "dangling link", tip: "Points at an IRI that has no node" },
  violation: { cls: "bad", text: "violation", tip: "A consistency shape fired on this node" },
  warning: { cls: "warn", text: "warning", tip: "A warning-level shape fired: worth a look, not an error" },
};
const STATUS = {
  answered: { cls: "ok", text: "answered", tip: "Returned rows" },
  empty: { cls: "bad", text: "empty", tip: "Answerable on this export, but returned nothing: the exporter doesn't emit the link" },
  "n/a": { cls: "na", text: "n/a on anon", tip: "Needs a full-access export; the source rows are hidden from anon" },
  unmodeled: { cls: "warn", text: "unmodeled", tip: "Uses a term the schema doesn't declare" },
};

const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const areaOf = c => AREA[c] || "other";
const colorOf = c => `var(--c-${areaOf(c)}, var(--muted))`;
const shortId = iri => iri.replace("https://brain-bbqs.org/id/", "bid:");
const fmt = n => Number(n).toLocaleString("en-US");
const store = {
  get(k, d) { try { const v = localStorage.getItem("bbqs-inspector:" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("bbqs-inspector:" + k, JSON.stringify(v)); } catch {} },
};

function noData() {
  $("#view").innerHTML = `<p class="empty">No report embedded. Run <code>python kg/quality.py</code> to build this page.</p>`;
}
if (!REPORT) { noData(); throw new Error("no report"); }

const S = REPORT.structure;
const ENT = REPORT.entities;
const BY_ID = new Map(ENT.map(e => [e.id, e]));
const CLASSES = Object.keys(S.per_class).sort((a, b) =>
  Object.keys(AREA_NAME).indexOf(areaOf(a)) - Object.keys(AREA_NAME).indexOf(areaOf(b)) || a.localeCompare(b));
const shapeViol = {};
const shapeWarn = {};
const isWarn = v => v.severity === "warning";
for (const e of ENT) for (const v of e.violations) { const m = isWarn(v) ? shapeWarn : shapeViol; m[v.shape] = (m[v.shape] || 0) + 1; }

(function stamp() {
  const built = REPORT.built_at ? new Date(REPORT.built_at) : null;
  const hours = built ? (Date.now() - built.getTime()) / 36e5 : null;
  const age = hours == null ? "" : hours < 1 ? "under an hour ago" : hours < 48 ? `${Math.round(hours)} h ago` : `${Math.round(hours / 24)} days ago`;
  const sha = (REPORT.commit || "").split(" ")[0];
  const commit = /^[0-9a-f]{7,}$/.test(sha)
    ? `<a href="https://github.com/brain-bbqs/bbqs-app/commit/${sha}" target="_blank" rel="noopener">${esc(REPORT.commit)}</a>` : esc(REPORT.commit || "unknown commit");
  const stale = hours != null && hours > 36 ? ` <span class="pill warn" title="The daily rebuild should keep this under a day old">stale</span>` : "";
  $("#src").innerHTML = `<span>Built ${built ? esc(built.toISOString().slice(0, 16).replace("T", " ")) + " UTC" : "at an unknown time"} · ${esc(age)}${stale}</span>
    <span>commit ${commit}</span><span>${esc(REPORT.source || REPORT.data_file)} · ${esc(REPORT.access)}</span>`;
})();

// ---- summary tiles -----------------------------------------------------------------------------
(function tiles() {
  const cq = REPORT.competency, answered = cq.filter(q => q.status === "answered").length;
  const ex = REPORT.shapes.filter(s => s.exercised).length;
  const isoPct = Math.round(100 * S.isolated / S.nodes);
  const t = [
    [fmt(S.triples), "triples", ""],
    [fmt(S.nodes), "nodes", ""],
    [fmt(S.edges), "links between nodes", ""],
    [`${fmt(S.isolated)}`, `isolated nodes (${isoPct}%)`, isoPct > 25 ? "bad" : isoPct > 5 ? "warn" : "ok"],
    [fmt(S.components), `connected pieces · largest ${fmt(S.largest_component)}`, S.components > 20 ? "warn" : "ok"],
    [`${answered}/${cq.length}`, "questions answered", answered === cq.length ? "ok" : answered >= cq.length / 2 ? "warn" : "bad"],
    [`${ex}/${REPORT.shapes.length}`, "shapes with data to check", ex === REPORT.shapes.length ? "ok" : "warn"],
    [fmt(REPORT.violation_count), "consistency violations", REPORT.violation_count ? "bad" : "ok"],
    ...(REPORT.warning_count ? [[fmt(REPORT.warning_count), "warnings", "warn"]] : []),
    ...(PUBS ? [[`${PUBS.rows.filter(r => r.projects.length).length}/${PUBS.count}`, "publications tied to a project",
                 PUBS.rows.every(r => r.projects.length) ? "ok" : "warn"]] : []),
    ...(MT ? [[fmt(MT.items.length), `meeting points · ${fmt(MT.meetings.length)} meetings`, ""]] : []),
  ];
  $("#tiles").innerHTML = t.map(([b, s, c]) => `<div class="tile ${c}"><b>${b}</b><span>${esc(s)}</span></div>`).join("");
})();

// ---- tabs --------------------------------------------------------------------------------------
const TABS = [
  ["entities", "Entities", ENT.length],
  ...(PUBS ? [["publications", "Publications", PUBS.count]] : []),
  ...(MT ? [["meetings", "Meetings", MT.meetings.length]] : []),
  ["questions", "Questions", REPORT.competency.length],
  ["shapes", "Shapes", REPORT.shapes.length],
  ["structure", "Structure", CLASSES.length],
];
// ---- review flags ------------------------------------------------------------------------------
// Only inside the artifact viewer, where the page is granted a db: there a reviewer can flag an
// entity, and the flag survives rebuilds because it lives in the artifact's store, keyed by IRI.
// Opened any other way (the public site, a local file) the page stays read-only.
const KINDS = { wrong: "Wrong", missing: "Missing", duplicate: "Duplicate", suspicious: "Suspicious" };
const RV = { db: null, uid: null, canWrite: null, readOnly: false, flags: new Map(), draft: null, status: "",
             qflags: new Map(), qdraft: new Map(), qstatus: new Map(), mflags: new Map(), mdraft: null, mstatus: "" };
const QKINDS = { wrong: "Answer is wrong", missing: "Answer is incomplete", question: "Question needs changing", idea: "Idea or follow-up" };
const qOpen = new Set();
const flagKey = iri => iri.replace("https://brain-bbqs.org/id/", "").replace(/\//g, "~");

// A flag keeps what its entity or question looked like when it was made, so this build can say
// whether the thing the reviewer pointed at has changed. It only marks a flag; clearing one stays
// the reviewer's call.
const fnv = s => { let h = 0x811c9dc5; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193); } return (h >>> 0).toString(16); };
const entityPrint = e => fnv(JSON.stringify([e.class, e.label, e.facts, e.out]));
const entitySnapshot = e => ({
  checks_at_flag: [...new Set(e.violations.map(v => v.shape))].sort(),
  isolated_at_flag: e.degree === 0,
  dangling_at_flag: e.dangling.length,
  fingerprint_at_flag: entityPrint(e),
});
const NOW = {
  resolved: { cls: "ok", text: "looks resolved" },
  changed: { cls: "warn", text: "changed, recheck" },
  open: { cls: "na", text: "unchanged" },
  gone: { cls: "warn", text: "not in this build" },
  unknown: { cls: "na", text: "no snapshot" },
};
function entityFlagState(f) {
  const e = BY_ID.get(f.iri);
  if (!e) return { k: "gone", why: "This IRI has no node in this build" };
  if (!f.fingerprint_at_flag) return { k: "unknown", why: "Flagged before flags kept the entity's state: check by hand" };
  const now = new Set(e.violations.map(v => v.shape)), was = f.checks_at_flag || [];
  const cleared = was.filter(s => !now.has(s));
  const linked = f.isolated_at_flag && e.degree > 0, undangled = f.dangling_at_flag > 0 && !e.dangling.length;
  const why = [...cleared.map(s => `${s} no longer fires`), ...(linked ? ["now linked"] : []), ...(undangled ? ["no dangling links left"] : [])];
  // What the flag can be checked against: the failing checks if there were any, else the missing
  // links. A flag on an entity that passed every check has nothing to test; only a change shows.
  const fixed = was.length ? cleared.length === was.length
    : f.isolated_at_flag ? linked : f.dangling_at_flag > 0 ? undangled : false;
  if (fixed) return { k: "resolved", why: why.join("; ") };
  // Flags made before snapshots existed had theirs recorded later; say so rather than imply flag time.
  const since = f.snapshot_backfilled_at ? `since ${f.snapshot_backfilled_at.slice(0, 10)}, when its state was first recorded` : "since it was flagged";
  const changed = entityPrint(e) !== f.fingerprint_at_flag;
  if (why.length || changed) return { k: "changed", why: why.length ? `${why.join("; ")}, but not everything it was flagged with` : `Its facts or links changed ${since}` };
  return { k: "open", why: `Same facts, links and checks ${since}` };
}
function questionFlagState(f) {
  const q = REPORT.competency.find(x => x.id === f.cq);
  if (!q) return { k: "gone", why: "This question isn't in this build" };
  const then = `${f.status_at_flag} with ${f.row_count_at_flag} rows`, now = `${q.status} with ${q.row_count} rows`;
  if (f.status_at_flag !== "answered" && q.status === "answered") return { k: "resolved", why: `Was ${then}, now ${now}` };
  if (q.status !== f.status_at_flag || q.row_count !== f.row_count_at_flag) return { k: "changed", why: `Was ${then}, now ${now}` };
  return { k: "open", why: `Still ${now}` };
}
const nowPill = s => `<span class="pill ${NOW[s.k].cls}" title="${esc(s.why)}">${NOW[s.k].text}</span>`;
const nowLine = s => `<span class="now">${nowPill(s)} <span class="muted">${esc(s.why)}</span></span>`;

async function initFlags() {
  if (!window.claude || typeof window.claude.use !== "function") return;
  const db = await window.claude.use("db");
  if (!db) return;
  const user = await window.claude.use("user");
  RV.db = db;
  RV.uid = user ? await user.id() : null;
  RV.canWrite = user ? await user.can("data.write") : null;
  db.collection("flags").onSnapshot(snap => {
    RV.flags = new Map(snap.docs.map(d => [d.data().iri, d.data()]));
    render();
  }, err => { RV.status = `Flags stopped updating (${err.code}). Reload the page to reconnect.`; render(); });
  db.collection("question_flags").onSnapshot(snap => {
    RV.qflags = new Map(snap.docs.map(d => [d.data().cq, d.data()]));
    render();
  }, err => { RV.status = `Feedback stopped updating (${err.code}). Reload the page to reconnect.`; render(); });
  if (MT) db.collection("meeting_flags").onSnapshot(snap => {
    RV.mflags = new Map(snap.docs.map(d => [d.data().item, d.data()]));
    render();
  }, err => { RV.status = `Meeting flags stopped updating (${err.code}). Reload the page to reconnect.`; render(); });
  render();
}

async function withRetry(fn) {
  try { return await fn(); } catch (e) {
    if (!e || e.code !== "unavailable") throw e;
    await new Promise(r => setTimeout(r, 400 + Math.random() * 600));
    return fn();
  }
}
function flagError(err) {
  const code = err && err.code;
  if (code === "invalid_argument" || code === "not_granted") { RV.readOnly = true; return "This page is read-only for you, so the flag wasn't saved."; }
  if (code === "quota_exceeded") return "The flag store is full. Remove flags that are resolved, then try again.";
  if (code === "revoked") return "Your access to this page changed. Reload to continue.";
  return "The flag wasn't saved. Check your connection and try again.";
}
function setFlagStatus(text) {
  RV.status = text;
  const el = document.getElementById("flag-status"); if (el) el.textContent = text;
}
function clearStatusSoon(text) {
  setTimeout(() => { if (RV.status === text) setFlagStatus(""); }, 2500);
}
async function saveFlag(iri) {
  const e = BY_ID.get(iri); if (!e || !RV.db) return;
  const body = {
    iri, class: e.class, label: e.label, kind: $("#flag-kind").value, note: $("#flag-note").value.trim(),
    flagged_at: new Date().toISOString(), flagged_by: RV.uid,
    report_commit: REPORT.commit || null, report_built_at: REPORT.built_at || null,
    ...entitySnapshot(e),
  };
  setFlagStatus("Saving…");
  try {
    await withRetry(() => RV.db.collection("flags").doc(flagKey(iri)).set(body));
    RV.draft = null; RV.status = "Flag saved.";
  } catch (err) { RV.status = flagError(err); }
  render(); clearStatusSoon("Flag saved.");
}
async function removeFlag(iri) {
  if (!RV.db) return;
  setFlagStatus("Removing…");
  try {
    await withRetry(() => RV.db.collection("flags").doc(flagKey(iri)).delete());
    RV.draft = null; RV.status = "Flag removed.";
  } catch (err) { RV.status = flagError(err); }
  render(); clearStatusSoon("Flag removed.");
}
function setQStatus(cq, text) {
  RV.qstatus.set(cq, text);
  const el = document.getElementById("qflag-status-" + cq); if (el) el.textContent = text;
}
async function saveQuestionFlag(cq) {
  const q = REPORT.competency.find(x => x.id === cq); if (!q || !RV.db) return;
  const body = {
    cq, question: q.question, area: q.area,
    kind: document.getElementById("qflag-kind-" + cq).value,
    note: document.getElementById("qflag-note-" + cq).value.trim(),
    status_at_flag: q.status, row_count_at_flag: q.row_count,
    flagged_at: new Date().toISOString(), flagged_by: RV.uid,
    report_commit: REPORT.commit || null, report_built_at: REPORT.built_at || null,
  };
  setQStatus(cq, "Saving…");
  try {
    await withRetry(() => RV.db.collection("question_flags").doc(cq).set(body));
    RV.qdraft.delete(cq); RV.qstatus.set(cq, "Feedback saved.");
  } catch (err) { RV.qstatus.set(cq, flagError(err)); }
  render();
  setTimeout(() => { if (RV.qstatus.get(cq) === "Feedback saved.") setQStatus(cq, ""); }, 2500);
}
async function removeQuestionFlag(cq) {
  if (!RV.db) return;
  setQStatus(cq, "Removing…");
  try {
    await withRetry(() => RV.db.collection("question_flags").doc(cq).delete());
    RV.qdraft.delete(cq); RV.qstatus.set(cq, "Feedback removed.");
  } catch (err) { RV.qstatus.set(cq, flagError(err)); }
  render();
  setTimeout(() => { if (RV.qstatus.get(cq) === "Feedback removed.") setQStatus(cq, ""); }, 2500);
}
function questionFlagHTML(q) {
  if (!RV.db) return "";
  const cur = RV.qflags.get(q.id);
  const who = cur ? `${cur.flagged_by && cur.flagged_by === RV.uid ? "You" : "Someone"} left feedback · ${esc(QKINDS[cur.kind] || cur.kind)} · ${esc(flagWhen(cur))} UTC, when it was ${esc(cur.status_at_flag)} with ${cur.row_count_at_flag} rows` : "";
  if (RV.readOnly || RV.canWrite === false) {

  }

const flagWhen = f => (f.flagged_at || "").slice(0, 16).replace("T", " ");

function renderFlags() {
  const rows = [...RV.flags.values()].sort((a, b) => (b.flagged_at || "").localeCompare(a.flagged_at || ""));
  const qrows = [...RV.qflags.values()].sort((a, b) => (a.cq || "").localeCompare(b.cq || ""));
  const by = {}; for (const f of rows) by[f.kind] = (by[f.kind] || 0) + 1;
  const summary = Object.entries(by).map(([k, n]) => `${n} ${esc((KINDS[k] || k).toLowerCase())}`).join(" · ");
  const states = new Map([...rows.map(f => [f, entityFlagState(f)]), ...qrows.map(f => [f, questionFlagState(f)])]);
  const nk = {}; for (const s of states.values()) nk[s.k] = (nk[s.k] || 0) + 1;
  const plural = { resolved: "look resolved", changed: "changed since", gone: "not in this build" };

      ${rows.length || qrows.length || RV.mflags.size ? `<button class="copy" id="flags-json">Copy as JSON</button>` : ""}
    </div>

      <td><button class="linkbtn" data-goq="${esc(f.cq)}">${esc(f.cq)}</button> ${esc(f.question || "")}</td>
      <td><span class="pill flag">${esc(QKINDS[f.kind] || f.kind)}</span></td><td>${nowPill(states.get(f))}</td><td>${esc(f.note || "")}</td>

      <h2>Entity flags · ${rows.length}</h2>` : ""}
    ${rows.length ? `<div class="tbl"><table><thead><tr><th>Entity</th><th>Problem</th><th>Now</th><th>Note</th><th>Flagged (UTC)</th><th>Built from</th></tr></thead><tbody>${rows.map(f => `<tr>
      <td>${BY_ID.has(f.iri) ? refLink(f.iri) : `<code>${esc(shortId(f.iri))}</code>`}</td>

}

const tabList = () => RV.db ? [...TABS, ["flags", "Flags", RV.flags.size + RV.qflags.size + RV.mflags.size]] : TABS;
let tab = (location.hash.slice(1) && TABS.some(t => t[0] === location.hash.slice(1))) ? location.hash.slice(1) : store.get("tab", "entities");

// ---- entities ----------------------------------------------------------------------------------
const PAGE = 120;
const st = { q: "", classes: new Set(store.get("classes", [])), flags: new Set(store.get("flags", [])), sel: null, limit: PAGE };

function matches(e) {
  if (st.classes.size && !st.classes.has(e.class)) return false;
  for (const f of st.flags) {
    const miss = f === "linked" ? e.degree === 0 : f === "flagged" ? (RV.db ? !RV.flags.has(e.id) : false) : !e.flags.includes(f);
    if (miss) return false;
  }
  if (st.q) {
    const q = st.q.toLowerCase();
    const hay = (e.label + " " + e.id + " " + Object.values(e.facts).flat().join(" ")).toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}

function cardHTML(e) {
  const flags = e.flags.map(f => `<span class="pill ${FLAG[f].cls}" title="${FLAG[f].tip}">${FLAG[f].text}</span>`).join("");
  return `<button class="card" data-id="${esc(e.id)}" aria-current="${st.sel === e.id}">
    <span class="lbl">${esc(e.label)}</span>
    <span class="deg" title="links to and from other nodes">${e.degree} link${e.degree === 1 ? "" : "s"}</span>
    <span class="sub"><span class="pill cls" style="color:${colorOf(e.class)}"><i class="swatch"></i>${esc(e.class)}</span>${flags}${RV.flags.has(e.id) ? `<span class="pill flag">flagged: ${esc((KINDS[RV.flags.get(e.id).kind] || "?").toLowerCase())}</span>${entityFlagState(RV.flags.get(e.id)).k === "resolved" ? nowPill(entityFlagState(RV.flags.get(e.id))) : ""}` : ""}</span>
  </button>`;
}

function refLink(iri) {
  const t = BY_ID.get(iri);
  if (!t) return `<code class="mono">${esc(shortId(iri))}</code>`;
  return `<button class="linkbtn" data-go="${esc(iri)}">${esc(t.label)}</button> <span class="pill cls" style="color:${colorOf(t.class)}">${esc(t.class)}</span>`;
}

function turtle(e) {
  const lines = [`${shortId(e.id)} a bbqs:${e.class}`];
  for (const [p, vs] of Object.entries(e.facts)) for (const v of vs) lines.push(`    bbqs:${p} ${JSON.stringify(v)}`);
  for (const l of e.out) lines.push(`    bbqs:${l.predicate} ${shortId(l.target)}`);
  for (const d of e.dangling) lines.push(`    bbqs:${d.predicate} ${shortId(d.target)}   # no such node`);
  return lines.join(" ;\n") + " .";
}

function detailHTML(e) {
  if (!e) return `<div class="detail"><p class="empty">Select an entity to see its facts, its links in both directions, and any check that fired on it.</p></div>`;
  const facts = Object.entries(e.facts);
  const why = e.flags.includes("isolated")
    ? `<p class="note">Nothing links to or from this node. Its class has ${S.per_class[e.class].isolated} of ${S.per_class[e.class].nodes} nodes isolated, so the cause is usually an edge the exporter doesn't write yet, not this record.</p>` : "";
  return `<div class="detail" aria-live="polite">
    <div style="display:grid;gap:6px">
      <span class="pill cls" style="color:${colorOf(e.class)};justify-self:start"><i class="swatch"></i>${esc(e.class)}</span>

    ${e.violations.length ? `<section><h3>Consistency checks</h3>${e.violations.map(v =>

    <section><h3>Facts</h3>${facts.length ? `<dl class="kv">${facts.map(([p, vs]) =>
      `<dt>${esc(p)}</dt><dd>${vs.map(v => /^https?:\/\//.test(v) ? `<a href="${esc(v)}" target="_blank" rel="noopener">${esc(v)}</a>` : esc(v)).join("<br>")}</dd>`).join("")}</dl>` : `<p class="empty">No literal facts.</p>`}</section>
    <section><h3>Links out · ${e.out.length}</h3>${e.out.length ? e.out.map(l => `<div class="edge"><span class="p">${esc(l.predicate)} →</span>${refLink(l.target)}</div>`).join("") : `<p class="empty">None.</p>`}</section>
    <section><h3>Links in · ${e.in.length}</h3>${e.in.length ? e.in.slice(0, 60).map(l => `<div class="edge">${refLink(l.source)}<span class="p">→ ${esc(l.predicate)}</span></div>`).join("") + (e.in.length > 60 ? `<p class="note">and ${e.in.length - 60} more</p>` : "") : `<p class="empty">None.</p>`}</section>
    ${e.dangling.length ? `<section><h3>Dangling links</h3>${e.dangling.map(d => `<div class="edge"><span class="p">${esc(d.predicate)} →</span><code>${esc(shortId(d.target))}</code><span class="pill bad">no node</span></div>`).join("")}</section>` : ""}
    <section><h3>As Turtle</h3><pre class="ttl">${esc(turtle(e))}</pre></section>
  </div>`;

const PCHECK = {
  no_project: { cls: "bad", text: "no project", look: true, tip: "No project links to it, so it is tied to no grant." },
  no_identifier: { cls: "bad", text: "no DOI or PMID", look: true, tip: "There is nothing to look the paper up by." },
  no_roster_author: { cls: "warn", text: "no author on the roster", look: true,
    tip: "None of its author ORCIDs belongs to someone on the project's roster, so the tie rests on the award credit alone. Rosters and ORCIDs are incomplete, so treat this as a prompt to look, not proof." },
  same_title: { cls: "warn", text: "title appears twice", look: true,
    tip: "Another record has the same title: usually a preprint and its published version, sometimes a duplicate." },
  several_projects: { cls: "na", text: "two or more projects", tip: "Credited to more than one project." },
  authors_unchecked: { cls: "na", text: "authors not checkable", tip: "The export has no author ORCIDs for it, so its authors can't be checked against the roster." },
  no_text: { cls: "na", text: "no text in this export", tip: "The full text is kept in the database's admin-only tables, not in the export." },

const PUB_BY_ID = new Map((PUBS ? PUBS.rows : []).map(r => [r.id, r]));
const ent = id => BY_ID.get(id) || { id, class: "Publication", label: shortId(id), facts: {}, out: [], in: [] };
const fact = (e, k) => ((e.facts || {})[k] || [])[0] || "";
const needsLook = r => r.checks.some(c => PCHECK[c] && PCHECK[c].look);
const uuidOf = iri => { const m = /([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})$/i.exec(iri || ""); return m ? m[1].toLowerCase() : null; };

const TEXT = { mcp: null, server: "BBQS-MCP", state: "idle", msg: "", rows: null, at: null, bodies: new Map() };
async function initText() {
  if (!PUBS || !window.claude || typeof window.claude.use !== "function") return;

function mcpMessage(err) {

    case "needs_reauth": return `Reconnect ${s} in claude.ai Settings → Connectors, then try again.`;
    case "server_not_connected": case "server_not_found":
      return `Add the ${s} connector in claude.ai Settings → Connectors to read the text here. It answers curators only.`;
    case "selection_required": return `You have more than one connector named ${s}. Choose one when claude.ai asks, then try again.`;
    case "not_in_manifest": case "consent_required": return `${s} isn't allowed on this page for you. Allow it when the page asks, then try again.`;
    case "blocked_by_policy": case "approval_required": return `Your organization's policy doesn't let this page use ${s}.`;
    case "not_granted": case "capability_disabled": case "capability_removed": return "This view can't use connectors.";
    case "tool_error": return `${s} refused: ${String(err.message || "no reason given").replace(/^Error:\s*/, "")}`;
    case "server_unavailable": case "upstream_error": case "rate_limited": return `${s} didn't answer. Try again in a moment.`;
    default: return `The text couldn't be read (${code || "unknown error"}).`;
  }
}
async function kgQuery(path, staleTime) {

  const call = () => TEXT.mcp.callTool(TEXT.server, "kg_query", { path }, { cache: { staleTime } });
  let res;
  try { res = await call(); } catch (e) {
    if (!e || e.retryable !== true) throw e;

  }

}

    TEXT.rows = new Map(rows.filter(r => r && r.resource_id).map(r => [String(r.resource_id).toLowerCase(), one(r.publication_fulltext)]));

  const pills = r.checks.filter(c => PCHECK[c] && c !== "no_text" && c !== "authors_unchecked").map(c => `<span class="pill ${PCHECK[c].cls}" title="${esc(PCHECK[c].tip)}">${esc(PCHECK[c].text)}</span>`).join("");
  const grants = r.projects.map(p => `<span class="pill cls" style="color:${colorOf("Project")}">${esc(p.grant_number || "no grant number")}</span>`).join("");
  const authors = r.author_orcids
    ? `${r.author_orcids} author ORCID${r.author_orcids === 1 ? "" : "s"} in the export. ${r.investigator_authors.length
        ? "BBQS investigators among them: " + r.investigator_authors.map(a => `${refLink(a.id)} <span class="pill ${a.on_roster ? "ok" : "na"}">${a.on_roster ? "on the project's roster" : "not on its roster"}</span>`).join(" ")
        : "None of them is a BBQS investigator in the graph."}`
    : "The export has no author ORCIDs for this paper, so its authors can't be checked against the roster.";
  return `<details class="q" data-pub="${esc(r.id)}" ${pOpen.has(r.id) ? "open" : ""}>
    <summary><span class="id">${esc(year || "—")}</span><span>${esc(e.label)}</span><span class="right">${grants}${pills}</span></summary>
    <div class="body">
      <dl class="kv">
        <dt>record</dt><dd>${esc(fact(e, "journal") || "no journal")}${year ? ` · ${esc(year)}` : ""} · ${pubLinks(e)} · ${refLink(r.id)}</dd>
        <dt>tied to</dt><dd>${r.projects.length ? r.projects.map(p => `${refLink(p.id)} <span class="muted">roster of ${p.roster}</span>`).join("<br>") : `<span class="pill bad">no project</span> Nothing ties it to a grant.`}</dd>
        <dt>how</dt><dd class="note">A <code>produced</code> link from the project, which the exporter writes from <code>project_publications</code>: the NIH award credited on the paper's PubMed record.</dd>
        <dt>authors</dt><dd>${authors}</dd>
        <dt>text</dt><dd>${textStatusHTML(r)}</dd>
      </dl>
      ${bodyHTML(r)}
      ${r.checks.filter(c => PCHECK[c] && PCHECK[c].look).map(c => `<div class="viol${PCHECK[c].cls === "warn" ? " w" : ""}"><b>${esc(PCHECK[c].text)}</b><span>${esc(PCHECK[c].tip)}</span></div>`).join("")}
    </div></details>`;
}
function textLoaderHTML() {
  if (!TEXT.mcp) return `<p class="note" style="margin:0">The full text is kept in the database's admin-only tables, so this export can't show it. Opened in the claude.ai artifact viewer, this page lets a curator read it through their BBQS-MCP connector.</p>`;
  const when = TEXT.at ? ` Checked ${esc(new Date(TEXT.at).toISOString().slice(0, 16).replace("T", " "))} UTC.` : "";
  const counts = TEXT.rows ? (() => { const v = [...TEXT.rows.values()]; const n = v.filter(Boolean).length;
      return n ? `${n} of ${TEXT.rows.size} publications in the database ${n === 1 ? "has" : "have"} text.${when}` : `No text is visible to you.${when} The text tables are admin-only, so only an admin sees them.`; })() : "";
  return `<div class="flagbox">
    <span class="note" style="margin:0">The full text is kept in the database's admin-only tables, not in the export. Read it here through your <b>${esc(TEXT.server)}</b> connector: the database decides what you can see, and nothing is stored in this page.</span>
    <div class="row"><button class="btn" id="ptext" ${TEXT.state === "loading" ? "disabled" : ""}>${TEXT.rows ? "Check again" : "Check the database for text"}</button>
      <span class="note" role="status" style="margin:0">${TEXT.state === "loading" ? "Checking…" : TEXT.state === "error" ? esc(TEXT.msg) : counts}</span></div>
  </div>`;
}
function renderPublications() {
  if (!PUBS) { $("#view").innerHTML = `<p class="empty">This build has no publication checks. Rebuild it with the current <code>kg/quality.py</code>.</p>`; return; }
  const rows = PUBS.rows, counts = { all: rows.length, look: rows.filter(needsLook).length };
  for (const r of rows) for (const c of r.checks) counts[c] = (counts[c] || 0) + 1;
  const tied = rows.filter(r => r.projects.length).length, checked = rows.filter(r => r.author_orcids).length;
  const onRoster = rows.filter(r => r.investigator_authors.some(a => a.on_roster)).length;
  const keys = ["all", "look", ...Object.keys(PCHECK).filter(k => counts[k])];
  const label = k => k === "all" ? "All" : k === "look" ? "Needs a look" : PCHECK[k].text;
  const q = pQ.trim().toLowerCase();
  const shown = rows.filter(r => (pFilter === "all" || (pFilter === "look" ? needsLook(r) : r.checks.includes(pFilter))) && (!q || pubHay(r).includes(q)))
    .sort((a, b) => fact(ent(b.id), "year").localeCompare(fact(ent(a.id), "year")) || ent(a.id).label.localeCompare(ent(b.id).label));
  $("#view").innerHTML = `<div style="display:grid;gap:14px">
    <p class="intro">Every publication in the export, the project and grant it is credited to, and what the export lets us check about that tie. <b>${tied} of ${rows.length}</b> are tied to a project${counts.several_projects ? ` (${counts.several_projects} to more than one)` : ""}. Only ${checked} carry author ORCIDs, and ${onRoster} of those ${onRoster === 1 ? "has" : "have"} an author on the project's roster.</p>
    ${textLoaderHTML()}
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
      <input class="search" id="pq" type="search" placeholder="Search titles, journals, DOIs, grant numbers" value="${esc(pQ)}" aria-label="Search publications" style="max-width:360px">
      <div class="filters">${keys.map(k => `<button data-pfilter="${k}" aria-pressed="${pFilter === k}">${esc(label(k))} · ${counts[k] || 0}</button>`).join("")}</div>
    </div>
    <div class="qgroup">${shown.map(pubRowHTML).join("") || `<p class="empty">No publication matches.</p>`}</div>
  </div>`;
}

// ---- meetings (internal) -----------------------------------------------------------------------
// Present only in the artifact build (kg/quality.py --internal): the working-group meeting records
// from kg/meetings.py. They are summaries with attributions, not transcripts.
const KIND = {
  lesson: { text: "Lesson", plural: "Lessons", c: "species" },
  agreement: { text: "Agreement", plural: "Agreements", c: "project" },
  disagreement: { text: "Disagreement", plural: "Disagreements", c: "org" },
  decision: { text: "Decision", plural: "Decisions", c: "people" },
  action: { text: "Action", plural: "Actions", c: "product" },
};
const HOW = { attributed: "said", owner: "owns", named: "named", relayed: "relayed" };
const HOW_TIP = { attributed: "The notes attribute this point to them", owner: "The notes give them this action",
                  named: "The sentence names them; they may not have said it", relayed: "They passed the point on for someone else" };
const MEET_BY = new Map(MT ? MT.meetings.map(m => [m.id, m]) : []);
const ITEM_BY = new Map(MT ? MT.items.map(i => [i.id, i]) : []);
const PEOPLE = new Map(MT ? MT.people.map(p => [p.name, p]) : []);
const PERSON_OF = new Map();
if (MT) for (const p of MT.people) for (const iri of p.investigators || []) PERSON_OF.set(iri, p.name);
const ITEMS_OF = new Map();
if (MT) for (const i of MT.items) { if (!ITEMS_OF.has(i.meeting)) ITEMS_OF.set(i.meeting, []); ITEMS_OF.get(i.meeting).push(i); }
const MKINDS = { person: "Wrong person", missing: "Someone is missing", text: "The point is wrong", other: "Something else" };
const MPAGE = 20;
const mt = { q: "", kinds: new Set(), groups: new Set(), person: "", quoted: false, tied: false, newest: true, limit: MPAGE, flagging: null };

function marked(text, quotes) {
  // The words the notes put in quotation marks, highlighted; everything else escaped as it is.
  let out = "", at = 0;
  for (const q of quotes || []) {
    const i = text.indexOf(q, at);
    if (i < 0) continue;
    out += esc(text.slice(at, i)) + `<mark class="q" title="In quotation marks in the notes">${esc(q)}</mark>`;
    at = i + q.length;
  }
  return out + esc(text.slice(at));
}
function whoHTML(item) {
  return item.who.map(w => w.name
    ? `<button class="who" data-person="${esc(w.name)}" aria-pressed="${mt.person === w.name}" title="${esc(`${HOW_TIP[w.how] || ""}. The notes write “${w.as_written}”: ${w.basis}.`)}">${esc(w.name)}<span class="how">${esc(HOW[w.how] || w.how)}</span></button>`
    : `<span class="who unres" tabindex="0" title="${esc(`Not resolved to one person: ${w.basis}.`)}">${esc(w.as_written)}?<span class="how">${esc(HOW[w.how] || w.how)}</span></span>`).join("");
}
const canFlag = () => RV.db && !(RV.readOnly || RV.canWrite === false);
function itemFlagHTML(item) {
  const cur = RV.mflags.get(item.id);
  const pill = cur ? `<span class="pill flag" title="${esc(cur.note || "")}">${cur.flagged_by && cur.flagged_by === RV.uid ? "you flagged" : "flagged"}: ${esc((MKINDS[cur.problem] || cur.problem || "?").toLowerCase())}</span>` : "";
  if (!canFlag()) return pill ? `<div class="chips">${pill}${cur.note ? `<span class="note">${esc(cur.note)}</span>` : ""}</div>` : "";
  if (mt.flagging !== item.id) return `<div class="chips">${pill}<button class="linkbtn quiet" data-mflag="${esc(item.id)}">${cur ? "Change flag" : "Flag this point"}</button></div>`;
  const d = RV.mdraft && RV.mdraft.item === item.id ? RV.mdraft : { problem: (cur && cur.problem) || "person", note: (cur && cur.note) || "" };
  return `<div class="flagbox">
    <span class="note" style="margin:0">Flag a wrong attribution or point. It is saved with this page for whoever triages the notes.</span>
    <div class="row"><label for="mflag-kind" class="muted" style="font-size:12.5px">Problem</label>
      <select id="mflag-kind">${Object.entries(MKINDS).map(([k, v]) => `<option value="${k}" ${d.problem === k ? "selected" : ""}>${v}</option>`).join("")}</select></div>
    <textarea id="mflag-note" aria-label="What's wrong, and how you know" placeholder="What's wrong, and how you know (who really said it?)">${esc(d.note)}</textarea>
    <div class="row"><button class="btn" data-mflagsave="${esc(item.id)}">${cur ? "Update flag" : "Save flag"}</button>
      ${cur ? `<button class="btn ghost" data-mflagremove="${esc(item.id)}">Remove flag</button>` : ""}
      <button class="btn ghost" data-mflagcancel="1">Cancel</button>
      <span class="note" id="mflag-status" role="status" style="margin:0">${esc(RV.mstatus)}</span></div>
  </div>`;
}
async function saveMeetingFlag(id) {
  const item = ITEM_BY.get(id), m = item && MEET_BY.get(item.meeting);
  if (!item || !RV.db) return;
  const body = {
    item: item.id, meeting: item.meeting, date: m.date, group: m.group, kind: item.kind,
    text_at_flag: item.text, who_at_flag: item.who.map(w => w.name || `${w.as_written}?`),
    problem: $("#mflag-kind").value, note: $("#mflag-note").value.trim(),
    flagged_at: new Date().toISOString(), flagged_by: RV.uid, notes_sha256: (MT.source || {}).sha256 || null,
  };
  RV.mstatus = "Saving…"; const el = $("#mflag-status"); if (el) el.textContent = RV.mstatus;
  try {
    await withRetry(() => RV.db.collection("meeting_flags").doc(item.id).set(body));
    RV.mdraft = null; mt.flagging = null; RV.mstatus = "";
  } catch (err) { RV.mstatus = flagError(err); }
  render();
}
async function removeMeetingFlag(id) {
  if (!RV.db) return;
  RV.mstatus = "Removing…";
  try {
    await withRetry(() => RV.db.collection("meeting_flags").doc(id).delete());
    RV.mdraft = null; mt.flagging = null; RV.mstatus = "";
  } catch (err) { RV.mstatus = flagError(err); }
  render();
}
function itemMatches(i) {
  const m = MEET_BY.get(i.meeting);
  if (mt.kinds.size && !mt.kinds.has(i.kind)) return false;
  if (mt.groups.size && !mt.groups.has(m.group)) return false;
  if (mt.person && !i.who.some(w => w.name === mt.person)) return false;
  if (mt.quoted && !i.quotes.length) return false;
  if (mt.tied && !i.who.some(w => w.how === "attributed" || w.how === "owner")) return false;
  if (mt.q) {
    const hay = [i.text, m.title, m.group, m.as_named, m.date, ...i.who.map(w => w.name || w.as_written)].join(" ").toLowerCase();
    if (!hay.includes(mt.q.toLowerCase())) return false;
  }
  return true;
}
const itemFilters = () => mt.kinds.size || mt.person || mt.quoted || mt.tied || mt.q;
function meetingHTML(m, items) {
  const order = Object.keys(KIND);
  const rows = [...items].sort((a, b) => order.indexOf(a.kind) - order.indexOf(b.kind) || a.n - b.n);
  const agenda = !itemFilters() && m.agenda.length ? `<p class="note" style="margin:0"><b>Agenda</b>: ${m.agenda.map(esc).join(" · ")}</p>` : "";
  return `<article class="mtg" id="mtg-${esc(m.id)}">
    <header><span class="date">${esc(m.date || "undated")}</span><span class="pill cls" style="color:var(--c-people)">${esc(m.group)}</span>
      <h3>${esc(m.title || "Untitled meeting")}</h3>
      ${m.note ? `<span class="pill na" title="Note on the source">${esc(m.note)}</span>` : ""}
      <span class="note" title="${esc(m.speakers.join(", "))}">${m.speakers.length} named speaker${m.speakers.length === 1 ? "" : "s"}</span></header>
    ${agenda}
    ${rows.map(i => `<div class="pt">
      <span class="kind" style="color:var(--c-${KIND[i.kind].c})"><i class="swatch"></i>${esc(KIND[i.kind].text)}</span>
      <div style="display:grid;gap:4px;min-width:0"><span>${marked(i.text, i.quotes)}</span>
        ${i.who.length ? `<div class="chips">${whoHTML(i)}</div>` : ""}
        ${itemFlagHTML(i)}</div></div>`).join("") || (agenda ? "" : `<p class="note" style="margin:0">No points recorded for this meeting.</p>`)}
  </article>`;
}
function personHTML(name) {
  const p = PEOPLE.get(name);
  if (!p) return "";
  const inv = p.investigators || [];
  const kg = inv.length
    ? `In the graph: ${inv.map(refLink).join(" · ")}${inv.length > 1 ? ` <span class="pill warn" title="The graph holds this person as ${inv.length} nodes">${inv.length} records</span>` : ""} <span class="note">(${esc(p.match)})</span>`
    : `<span class="muted">No investigator in the graph matches this name.</span>`;
  return `<div class="flagbox" style="background:var(--surface)">
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:baseline;justify-content:space-between"><h2>${esc(p.name)}</h2><button class="linkbtn" id="mperson-clear">Show everyone</button></div>
    <span>Named as a speaker in ${p.meetings} meeting${p.meetings === 1 ? "" : "s"}${p.groups.length ? ` (${p.groups.map(esc).join(", ")})` : ""}. ${p.attributed} point${p.attributed === 1 ? "" : "s"} attributed, ${p.owns} action${p.owns === 1 ? "" : "s"} owned, named in ${p.named} more.</span>
    <span>${kg}</span>
  </div>`;
}
function renderMeetings() {
  if (!MT) { $("#view").innerHTML = `<p class="empty">This copy of the page has no meeting notes.</p>`; return; }
  const hits = MT.items.filter(itemMatches), byMeeting = new Map();
  for (const i of hits) { if (!byMeeting.has(i.meeting)) byMeeting.set(i.meeting, []); byMeeting.get(i.meeting).push(i); }
  let meetings = MT.meetings.filter(m => itemFilters() ? byMeeting.has(m.id) : (!mt.groups.size || mt.groups.has(m.group)));
  if (mt.newest) meetings = [...meetings].reverse();
  const kindCount = {}, groupCount = {};
  for (const i of MT.items) kindCount[i.kind] = (kindCount[i.kind] || 0) + 1;
  for (const m of MT.meetings) groupCount[m.group] = (groupCount[m.group] || 0) + 1;
  const people = MT.people.filter(p => p.attributed + p.owns + p.named > 0).sort((a, b) => a.name.localeCompare(b.name));
  const src = MT.source || {};
  $("#view").innerHTML = `<div style="display:grid;gap:14px">
    <div style="display:grid;gap:6px"><p class="intro">Lessons, agreements, disagreements, decisions and actions from the working-group meetings, by date, with who each point is tied to: <b>said</b> (the notes attribute it to them), <b>owns</b> (their action), <b>named</b> (the sentence mentions them). Hover a name to see how it was matched.</p>
      <p class="intro note"><span class="pill warn">not transcripts</span> ${esc(MT.caveat || "")}</p>
      <p class="note" style="margin:0">${esc(src.description || "")} Built from <code>${esc(src.file || "the notes")}</code>${src.sha256 ? ` (sha256 ${esc(src.sha256.slice(0, 12))})` : ""}. Internal: this copy of the page only, never the public site.</p></div>
    <div class="meet">
      <aside class="facets">
        <input class="search" id="mq" type="search" placeholder="Search points, meetings, people" value="${esc(mt.q)}" aria-label="Search meeting notes">
        <fieldset><legend>Person</legend>
          <select id="mperson" class="search" aria-label="Show one person's points"><option value="">Everyone</option>${people.map(p => `<option value="${esc(p.name)}" ${mt.person === p.name ? "selected" : ""}>${esc(p.name)} · ${p.attributed + p.owns + p.named}</option>`).join("")}</select></fieldset>
        <fieldset><legend>Kind</legend>${Object.entries(KIND).map(([k, v]) => `<label><input type="checkbox" data-mkind="${k}" ${mt.kinds.has(k) ? "checked" : ""}><i class="swatch" style="color:var(--c-${v.c})"></i>${v.plural}<span class="c">${kindCount[k] || 0}</span></label>`).join("")}</fieldset>
        <fieldset><legend>Group</legend>${Object.keys(groupCount).sort().map(g => `<label><input type="checkbox" data-mgroup="${esc(g)}" ${mt.groups.has(g) ? "checked" : ""}>${esc(g)}<span class="c">${groupCount[g]}</span></label>`).join("")}</fieldset>
        <fieldset><legend>Only</legend>
          <label><input type="checkbox" id="mtied" ${mt.tied ? "checked" : ""}>Points tied to someone</label>
          <label><input type="checkbox" id="mquoted" ${mt.quoted ? "checked" : ""}>Words in quotation marks</label></fieldset>
        <button class="linkbtn" id="mclear">Clear filters</button>
      </aside>
      <div class="list">
        ${mt.person ? personHTML(mt.person) : ""}
        <div class="meta"><span>${fmt(hits.length)} of ${fmt(MT.items.length)} points · ${fmt(meetings.length)} meeting${meetings.length === 1 ? "" : "s"}</span>
          <button class="linkbtn" id="morder">${mt.newest ? "Newest first" : "Oldest first"} ⇅</button></div>
        ${meetings.slice(0, mt.limit).map(m => meetingHTML(m, byMeeting.get(m.id) || [])).join("") || `<p class="empty">No point matches these filters.</p>`}
        ${meetings.length > mt.limit ? `<button class="copy more" id="mmore">Show ${Math.min(MPAGE, meetings.length - mt.limit)} more meetings</button>` : ""}
      </div>
    </div>
  </div>`;
}
function meetingFlagsHTML() {
  if (!MT) return "";
  const rows = [...RV.mflags.values()].sort((a, b) => (b.flagged_at || "").localeCompare(a.flagged_at || ""));
  if (!rows.length) return `<p class="empty">No meeting point flagged yet. Use “Flag this point” on the Meetings tab when an attribution looks wrong.</p>`;
  return `<h2>Meeting notes · ${rows.length}</h2><div class="tbl"><table><thead><tr><th>Meeting</th><th>Point</th><th>Problem</th><th>Note</th><th>Now</th><th>Flagged (UTC)</th></tr></thead><tbody>${rows.map(f => {
    const now = ITEM_BY.get(f.item);
    const state = !now ? `<span class="pill warn">not in these notes</span>` : now.text !== f.text_at_flag ? `<span class="pill warn">text changed</span>` : `<span class="pill na">unchanged</span>`;
    return `<tr><td class="mono">${esc(f.date || "")} · ${esc(f.group || "")}</td><td>${esc(f.text_at_flag || "")}<br><span class="note">${esc((f.who_at_flag || []).join(", "))}</span></td>
      <td><span class="pill flag">${esc(MKINDS[f.problem] || f.problem || "")}</span></td><td>${esc(f.note || "")}</td><td>${state}</td><td class="mono">${esc(flagWhen(f))}</td></tr>`;
  }).join("")}</tbody></table></div>`;
}
function inMeetingsHTML(e) {
  const name = MT && e.class === "Investigator" ? PERSON_OF.get(e.id) : null, p = name && PEOPLE.get(name);
  if (!p) return "";
  return `<section><h3>In the meeting notes</h3><p style="margin:0">${esc(p.name)}: named as a speaker in ${p.meetings} meeting${p.meetings === 1 ? "" : "s"}; ${p.attributed} point${p.attributed === 1 ? "" : "s"} attributed, ${p.owns} action${p.owns === 1 ? "" : "s"} owned, named in ${p.named} more. <span class="note">(${esc(p.match)})</span></p>
    <button class="btn ghost" style="justify-self:start" data-goperson="${esc(p.name)}">Show their points in Meetings</button></section>`;

// Events for the two tabs above. The listeners for the other tabs are where those tabs are built.
$("#view").addEventListener("toggle", e => {
  const d = e.target.closest && e.target.closest("details[data-pub]");
  if (d) d.open ? pOpen.add(d.dataset.pub) : pOpen.delete(d.dataset.pub);
}, true);
$("#view").addEventListener("input", e => {
  if (e.target.id === "pq") { pQ = e.target.value; render(); }
  else if (e.target.id === "mq") { mt.q = e.target.value; mt.limit = MPAGE; render(); }
  else if (e.target.id === "mflag-note") RV.mdraft = { item: mt.flagging, problem: $("#mflag-kind").value, note: e.target.value };
});
$("#view").addEventListener("change", e => {
  const t = e.target, d = t.dataset || {};
  if (t.id === "mflag-kind") { RV.mdraft = { item: mt.flagging, problem: t.value, note: $("#mflag-note").value }; return; }
  if (d.mkind) t.checked ? mt.kinds.add(d.mkind) : mt.kinds.delete(d.mkind);
  else if (d.mgroup) t.checked ? mt.groups.add(d.mgroup) : mt.groups.delete(d.mgroup);
  else if (t.id === "mperson") mt.person = t.value;
  else if (t.id === "mtied") mt.tied = t.checked;
  else if (t.id === "mquoted") mt.quoted = t.checked;
  else return;
  mt.limit = MPAGE; render();
});
$("#view").addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t) return;
  const d = t.dataset;
  if (d.pfilter) { pFilter = d.pfilter; render(); }
  else if (t.id === "ptext") loadTextStatus();
  else if (d.pbody) loadBody(d.pbody);
  else if (d.person) { mt.person = mt.person === d.person ? "" : d.person; mt.limit = MPAGE; render(); $("#view").scrollIntoView({ block: "start" }); }
  else if (d.goperson) { mt.person = d.goperson; mt.limit = MPAGE; tab = "meetings"; store.set("tab", tab); render(); }
  else if (t.id === "mperson-clear") { mt.person = ""; render(); }
  else if (t.id === "mclear") { Object.assign(mt, { q: "", person: "", quoted: false, tied: false, limit: MPAGE }); mt.kinds.clear(); mt.groups.clear(); render(); }
  else if (t.id === "morder") { mt.newest = !mt.newest; render(); }
  else if (t.id === "mmore") { mt.limit += MPAGE; render(); }
  else if (d.mflag) { mt.flagging = d.mflag; RV.mdraft = null; RV.mstatus = ""; render(); $("#mflag-note")?.focus(); }
  else if (d.mflagcancel) { mt.flagging = null; RV.mdraft = null; render(); }
  else if (d.mflagsave) saveMeetingFlag(d.mflagsave);
  else if (d.mflagremove) removeMeetingFlag(d.mflagremove);
});

function render() {
  // A live flag update re-renders while someone may be typing: put focus and caret back.
  const a = document.activeElement, focusId = a && a.id;
  const caret = a && typeof a.selectionStart === "number" ? [a.selectionStart, a.selectionEnd] : null;
  if (tab !== "flags" && !TABS.some(t => t[0] === tab)) tab = "entities";   // a tab this copy doesn't have
  renderTabs();
  try { history.replaceState(null, "", "#" + tab); } catch {}
  const views = { entities: renderEntities, questions: renderQuestions, shapes: renderShapes, structure: renderStructure,
                  publications: renderPublications, meetings: renderMeetings,
                  flags: RV.db ? renderFlags : renderEntities };
  (views[tab] || renderEntities)();
  const el = focusId && document.getElementById(focusId);
  if (el && el !== document.activeElement) { el.focus(); if (caret && el.setSelectionRange) el.setSelectionRange(caret[0], caret[1]); }
}
if (MT) { const n = $("#internal-note"); n.textContent = "This copy also carries the working-group meeting notes, which are internal: the public Inspector never does."; n.hidden = false; }
render();
initFlags();
initText();
</script>
